<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CafeCast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f1ea; --card:#fffefb; --ink:#2c211c; --muted:#756b64; --line:#e4dbd0;
  --accent:#24705a; --accent2:#24705a; --warn:#c95045; --amber:#b97818; --glass:rgba(245,241,234,.88);
  --soft:#e8f1ed; --sage:#dfece6; --cream:#fbf7f0; --espresso:#2c211c;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;min-height:100vh;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
header{position:sticky;top:0;z-index:5;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);padding:14px 16px 0;text-align:center;border-bottom:1px solid var(--line)}
h1{font-size:1.55rem;font-weight:750;letter-spacing:-.035em;margin:0}
.sub{color:var(--muted);font-size:.78rem;margin-top:2px}
.brand{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:10px}.brand-copy{text-align:left}.brand-mark{width:42px;height:42px;border-radius:14px;background:var(--accent);display:grid;place-items:center;color:#fff;box-shadow:0 7px 18px rgba(36,112,90,.2)}.brand-mark svg{width:23px;height:23px}
nav{display:flex;justify-content:center;gap:4px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;padding:7px 16px;border-radius:980px;border:none;background:transparent;color:var(--muted);font:500 .9rem var(--font);cursor:pointer}
nav button:hover{color:var(--ink)}
nav button.active{background:var(--ink);color:var(--bg)}
nav .count{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--warn);color:#fff;font-size:.72rem;line-height:18px}
main{width:100%;max-width:1480px;margin:0 auto;padding:clamp(18px,2.6vw,38px) 22px 80px}
.card{background:var(--card);border-radius:clamp(16px,2vw,22px);padding:clamp(16px,2vw,28px);margin-bottom:18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{font-size:clamp(1.15rem,1rem + .5vw,1.5rem);font-weight:600;letter-spacing:-.02em;margin:0 0 6px}
.card h3{font-size:1rem;margin:18px 0 8px}
.lead{color:var(--muted);font-size:.92rem;margin:0 0 14px;line-height:1.45}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;align-items:flex-end}
input,select,textarea{padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:400 .95rem var(--font);outline:none;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(36,112,90,.16)}
textarea{width:100%;min-height:92px;resize:vertical;line-height:1.45}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
label{font-size:.78rem;color:var(--muted);display:block;margin-bottom:5px;font-weight:500}
.field{flex:1 1 140px}
.field input,.field select{width:100%}
.help{font-size:.78rem;color:var(--muted);margin-top:4px;line-height:1.35}
.btn{display:inline-block;padding:11px 22px;border-radius:980px;border:none;background:var(--accent);color:#fff;font:500 .95rem var(--font);cursor:pointer;text-decoration:none}
.btn:hover{opacity:.88;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.secondary{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:6px 14px;font-size:.84rem}
.btn.sm{padding:7px 14px;font-size:.85rem}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn);padding:6px 14px;font-size:.84rem}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
table{width:100%;border-collapse:collapse;font-size:clamp(.82rem,.78rem + .2vw,.95rem)}
th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
th{color:var(--muted);font-weight:500;font-size:.76rem;white-space:nowrap}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pill{display:inline-block;padding:3px 10px;border-radius:980px;font-size:.74rem;font-weight:600;white-space:nowrap;margin:1px 2px 1px 0}
.pill.low{background:rgba(215,0,21,.12);color:var(--warn)}
.pill.ok{background:rgba(29,138,74,.14);color:var(--accent2)}
.pill.mid{background:rgba(255,159,10,.16);color:var(--amber)}
.pill.info{background:rgba(0,113,227,.12);color:var(--accent)}
.badge{display:inline-block;padding:1px 8px;border-radius:6px;font-size:.7rem;font-weight:600;background:var(--soft);color:var(--accent);vertical-align:middle;white-space:nowrap}
.big{font-size:clamp(2rem,1.4rem + 2vw,3.2rem);font-weight:700;letter-spacing:-.04em;line-height:1.1}
.big.sm{font-size:clamp(1.5rem,1.2rem + .9vw,2.2rem)}
.muted{color:var(--muted);font-size:.85rem}
.empty{color:var(--muted);font-size:.95rem;padding:18px 0;text-align:center}
.del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:2px 6px}
.del:hover{color:var(--warn)}
.label{font-size:.85rem;color:var(--muted);font-weight:500;margin-bottom:2px}
.src{font-size:.78rem;color:var(--muted);margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.dash-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(12px,1.6vw,22px)}
.dash-grid .card{margin-bottom:0}
.c5{grid-column:span 5}.c7{grid-column:span 7}
.fhead{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px 28px;margin-top:10px}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:8px}
.rec{padding:12px 0;border-bottom:1px solid var(--line);font-size:.95rem;line-height:1.45}
.rec:last-child{border-bottom:none}
.rec .btn{margin-top:10px}
.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 18px}
.status-box{background:var(--bg);border-radius:14px;padding:12px 14px}
.status-box strong{display:block;font-size:1.35rem;line-height:1.15;margin-top:3px}
.action-list{margin:12px 0;border-top:1px solid var(--line)}
.action-row{display:grid;grid-template-columns:minmax(120px,1fr) auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.action-row .why{color:var(--muted);font-size:.82rem;line-height:1.35;margin-top:3px}
.action-row .qty{text-align:right;font-weight:600;white-space:nowrap}
.section-label{font-size:.76rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:14px}
.reason-short{color:var(--ink);font-size:.84rem;line-height:1.35;max-width:420px}
.reason-detail{color:var(--muted);font-size:.8rem;line-height:1.4;max-width:520px}
.calc-grid{display:grid;grid-template-columns:repeat(3,minmax(90px,1fr));gap:7px;margin:9px 0}.calc-step{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:8px}.calc-step span{display:block;color:var(--muted);font-size:.68rem;line-height:1.25}.calc-step strong{display:block;font-size:.86rem;margin-top:3px}.calc-note{color:var(--muted);font-size:.76rem;line-height:1.35}.attention-note{display:flex;align-items:flex-start;gap:10px;background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin:10px 0 14px}.attention-note .svg-icon{color:var(--accent);margin-top:1px}
.order-state{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.state-chip{border-radius:980px;padding:7px 11px;background:var(--bg);font-size:.82rem;color:var(--muted)}
.state-chip strong{color:var(--ink)}
.agent{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:18px;padding:14px 18px;margin-bottom:18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.agent-txt{flex:1;font-size:.92rem;line-height:1.45}
.pulse{width:12px;height:12px;border-radius:50%;background:var(--accent2);flex:0 0 auto;box-shadow:0 0 0 0 rgba(48,209,88,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(48,209,88,.5)}70%{box-shadow:0 0 0 10px rgba(48,209,88,0)}100%{box-shadow:0 0 0 0 rgba(48,209,88,0)}}
.flash{background:var(--soft);color:var(--ink);border-radius:14px;padding:12px 16px;margin-bottom:18px;font-size:.92rem;line-height:1.45}
.note{background:var(--bg);border-radius:14px;padding:12px 14px;font-size:.86rem;color:var(--muted);line-height:1.45;margin:10px 0}
.sup{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.sup-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.sup-act{display:flex;align-items:center;gap:10px}
.qin{width:84px;padding:6px 8px}
tr.skipped td{opacity:.45}
.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:6px}
.drop{display:block;border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;cursor:pointer;color:var(--muted);font-size:.95rem;margin:6px 0 12px}
.drop:hover{border-color:var(--accent);color:var(--accent)}
.drop input{display:none}
details{margin-top:12px}
summary{cursor:pointer;color:var(--accent);font-size:.9rem;font-weight:500}
details[open] summary{margin-bottom:12px}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:none}
.tick{width:24px;height:24px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;border:2px solid var(--line);color:var(--muted)}
.tick.done{background:var(--accent2);border-color:var(--accent2);color:#fff}
.edit-tbl input:not([type=checkbox]),.edit-tbl select{padding:6px 8px;font-size:.85rem;border-radius:9px}
.edit-tbl td{vertical-align:middle;padding:6px 4px}
.w-num{width:70px}.w-txt{width:130px}.w-mail{width:190px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid2 .card{margin-bottom:0}
.ds{display:flex;gap:8px;align-items:center;justify-content:center;margin:-4px 0 10px}.ds label{margin:0}.ds select{padding:7px 10px;font-size:.78rem;border-radius:12px;width:100%}
.stat-line{display:flex;justify-content:space-between;gap:8px;padding:6px 0;font-size:.92rem}
.hero-plan{background:linear-gradient(135deg,#0d2a45 0%,#123e64 55%,#0b6b59 100%);color:#fff;overflow:hidden;position:relative}
.hero-plan:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-90px;top:-120px;background:rgba(255,255,255,.08)}
.hero-plan .lead,.hero-plan .muted{color:rgba(255,255,255,.74)}
.plan-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px;position:relative;z-index:1}
.plan-kpi{padding:14px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12)}
.plan-kpi span{display:block;font-size:.75rem;color:rgba(255,255,255,.7);margin-bottom:4px}.plan-kpi strong{font-size:1.35rem}
.score{display:flex;align-items:center;gap:16px;margin:14px 0}.score-ring{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:1.25rem;font-weight:700;background:conic-gradient(var(--accent2) var(--score),var(--line) 0);position:relative}.score-ring:after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--card)}.score-ring span{position:relative;z-index:1}
.signal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.signal{border:1px solid var(--line);border-radius:14px;padding:12px}.signal b{display:block;font-size:.9rem;margin-bottom:3px}.signal small{color:var(--muted);line-height:1.35;display:block}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:center;margin:16px 0}.flow-step{background:var(--bg);border-radius:14px;padding:14px;min-height:96px}.flow-step b{display:block;margin:5px 0}.flow-icon{font-size:1.35rem}.flow-arrow{color:var(--muted);font-size:1.4rem}
.special{border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.special-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.price-cut{font-size:1.25rem;font-weight:700;white-space:nowrap}.strike{text-decoration:line-through;color:var(--muted);font-size:.82rem;margin-right:5px}.special-meta{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.active-promo{background:rgba(29,138,74,.1);border-color:rgba(29,138,74,.35)}
.brief{margin:12px 0 0;padding:0;list-style:none}.brief li{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.14);line-height:1.4}.brief li:last-child{border:0}.brief strong{color:#fff}
.limit{border-left:3px solid var(--amber);padding:10px 12px;background:rgba(255,159,10,.08);border-radius:0 12px 12px 0;color:var(--muted);font-size:.82rem;line-height:1.45}
.svg-icon{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;flex:0 0 auto}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:0 0 20px}.page-head h2{font-size:clamp(1.7rem,1.2rem + 1.2vw,2.55rem);letter-spacing:-.045em;margin:4px 0 5px}.eyebrow{text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-size:.71rem;font-weight:750}.page-head p{margin:0;color:var(--muted);font-size:.92rem}
.daily-hero{position:relative;overflow:hidden;border-radius:26px;background:linear-gradient(125deg,#2c211c 0%,#3b2d26 47%,#276f5b 135%);color:#fff;padding:28px 30px;margin-bottom:16px;box-shadow:0 14px 35px rgba(44,33,28,.13)}.daily-hero:after{content:"";position:absolute;width:290px;height:290px;border-radius:50%;right:-90px;top:-145px;background:rgba(255,255,255,.06)}.daily-hero-grid{display:grid;grid-template-columns:1.5fr repeat(3,minmax(115px,.55fr));gap:16px;align-items:end;position:relative;z-index:1}.hero-label{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.68);font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700}.hero-title{font-size:clamp(2rem,1.3rem + 2vw,3.35rem);font-weight:750;letter-spacing:-.055em;line-height:1.02;margin:10px 0 8px}.hero-copy{color:rgba(255,255,255,.72);font-size:.88rem;line-height:1.45;max-width:600px}.hero-stat{border-left:1px solid rgba(255,255,255,.17);padding-left:16px}.hero-stat span{display:block;color:rgba(255,255,255,.62);font-size:.73rem;margin-bottom:5px}.hero-stat strong{display:block;font-size:1.35rem;letter-spacing:-.03em}.hero-stat small{display:block;color:rgba(255,255,255,.65);font-size:.72rem;margin-top:4px;line-height:1.35}
.hero-ai{position:relative;z-index:2;display:grid;grid-template-columns:minmax(220px,.75fr) minmax(360px,1.25fr);gap:18px;align-items:end;border-top:1px solid rgba(255,255,255,.16);margin-top:20px;padding-top:18px}.hero-ai-copy{font-size:.82rem;line-height:1.45;color:rgba(255,255,255,.72)}.hero-ai-copy strong{display:block;color:#fff;font-size:.95rem;margin-bottom:3px}.hero-ai-copy .pill{margin-top:8px;background:rgba(255,255,255,.12);color:#fff}.hero-ai-controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:end}.hero-ai-controls label{color:rgba(255,255,255,.68)}.hero-ai-controls input{background:rgba(255,255,255,.94);border-color:transparent}.hero-ai-controls .btn{background:#fff;color:var(--espresso);white-space:nowrap}.hero-ai-controls .btn:hover{background:var(--cream)}.hero-ai-status{grid-column:1/-1;min-height:17px;color:rgba(255,255,255,.67);font-size:.75rem}.hero-ai-status.error{color:#ffd0ca}.hero-ai-result{grid-column:1/-1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:12px 14px;font-size:.82rem;line-height:1.45;color:rgba(255,255,255,.78)}.hero-ai-result strong{color:#fff}.hero-ai-result .pill{margin-left:5px;background:rgba(255,255,255,.13);color:#fff}
.metric-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.metric-tile{width:100%;font:inherit;color:inherit;text-align:left;background:var(--card);border:1px solid rgba(44,33,28,.05);border-radius:18px;padding:15px 40px 15px 17px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 18px rgba(44,33,28,.035);position:relative}.metric-tile:after{content:'→';position:absolute;right:16px;color:var(--muted);font-size:1rem;transition:transform .18s,color .18s}.metric-icon{width:38px;height:38px;border-radius:12px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:0 0 auto}.metric-icon.amber{background:#f8ead2;color:var(--amber)}.metric-icon.red{background:#f8e2df;color:var(--warn)}.metric-tile span{display:block;color:var(--muted);font-size:.72rem}.metric-tile strong{display:block;font-size:1.12rem;margin-top:2px}
.decision-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(320px,.75fr);gap:16px;margin-bottom:16px}.panel-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:4px}.panel-title h2{display:flex;align-items:center;gap:9px}.decision-stack{margin-top:10px}.decision-card{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:13px;align-items:start;padding:16px 10px;margin:0 -10px;border-bottom:1px solid var(--line);border-radius:14px}.decision-card:last-child{border-bottom:0}.decision-icon{width:42px;height:42px;border-radius:13px;background:var(--soft);color:var(--accent);display:grid;place-items:center}.decision-icon.amber{background:#f8ead2;color:var(--amber)}.decision-icon.red{background:#f8e2df;color:var(--warn)}.decision-rank{color:var(--muted);font-size:.7rem;font-weight:750;text-transform:uppercase;letter-spacing:.06em}.decision-card h3{font-size:1.03rem;margin:3px 0 4px}.decision-card p{color:var(--muted);font-size:.82rem;line-height:1.42;margin:0;max-width:680px}.decision-impact{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}.decision-action{text-align:right;min-width:130px}.decision-action strong{display:block;font-size:1rem;margin-bottom:7px}
.dashboard-link{cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background-color .18s ease}.dashboard-link:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(44,33,28,.1);border-color:rgba(36,112,90,.22)}.dashboard-link:hover:after{transform:translateX(3px);color:var(--accent)}.dashboard-link:focus-visible{outline:3px solid rgba(36,112,90,.25);outline-offset:3px}.decision-card.dashboard-link:hover{transform:none;box-shadow:none;background:var(--cream)}.daily-hero.dashboard-link:hover{box-shadow:0 18px 42px rgba(44,33,28,.19)}.daily-hero.dashboard-link:before{content:'Open sales history  →';position:absolute;right:28px;bottom:18px;z-index:2;color:rgba(255,255,255,.72);font-size:.72rem;font-weight:700;letter-spacing:.02em}
.anchor-target{scroll-margin-top:24px}.anchor-flash{animation:anchorPulse 1.15s ease}@keyframes anchorPulse{0%,100%{box-shadow:0 4px 18px rgba(44,33,28,.04)}35%{box-shadow:0 0 0 4px rgba(36,112,90,.18),0 12px 28px rgba(44,33,28,.1)}}
.driver{padding:10px 0;border-bottom:1px solid var(--line)}.driver:last-of-type{border-bottom:0}.driver-line{display:flex;justify-content:space-between;font-size:.84rem;margin-bottom:6px}.driver-bar{height:6px;background:#eee6dc;border-radius:8px;overflow:hidden}.driver-bar i{display:block;height:100%;border-radius:8px;background:var(--accent)}.driver-bar i.down{background:var(--amber)}
.confidence-row{display:flex;align-items:center;gap:12px;padding:13px;border-radius:15px;background:var(--cream);margin:12px 0}.confidence-dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--accent);font-size:.78rem;font-weight:750}.confidence-row strong{display:block;font-size:.9rem}.confidence-row span{display:block;color:var(--muted);font-size:.75rem;margin-top:2px}

const ingById=id=>db.ingredients.find(i=>i.id===id);
const menuById=id=>db.menu.find(m=>m.id===id);
const stockOf=i=>r2(sum(i.batches,b=>b.qty));
const byExp=(a,b)=>{const x=a.expiry||'9999',y=b.expiry||'9999';return x<y?-1:x>y?1:0;};
function consume(i,q){ i.batches.sort(byExp); for(const b of i.batches){ if(q<=0) break; const t=Math.min(b.qty,q); b.qty=r2(b.qty-t); q-=t; } i.batches=i.batches.filter(b=>b.qty>0.0001); }
function addBatch(i,q,exp){ if(q<=0) return; const ex=i.batches.find(b=>b.expiry===exp); if(ex) ex.qty=r2(ex.qty+q); else i.batches.push({qty:r2(q),expiry:exp}); }
const newExpiry=i=>i.shelf?addDaysISO(+i.shelf):null;
function setStock(i,n){ const cur=stockOf(i); if(n<cur) consume(i,cur-n); else addBatch(i,n-cur,newExpiry(i)); }
const costOfItem=m=>sum(m.recipe,r=>{const i=ingById(r.ing);return i?i.cost*r.qty:0;});
const needsRecipe=m=>!m.recipe.length&&!m.noPerishables;
function deductForSale(m,q){ m.recipe.forEach(r=>{const i=ingById(r.ing); if(i) consume(i,r.qty*q);}); }
function logWaste(i,q,reason,auto){ consume(i,q); db.waste.push({id:cid(),ingId:i.id,name:i.name,unit:i.unit,qty:r2(q),reason,cost:r2(i.cost*q),ts:Date.now(),auto:!!auto}); }

/* Expired batches are removed from stock and logged as waste automatically */
function autoExpire(){
  let n=0;
  db.ingredients.forEach(i=>{
    i.batches.filter(b=>b.expiry&&daysUntil(b.expiry)<0).forEach(b=>{
      db.waste.push({id:cid(),ingId:i.id,name:i.name,unit:i.unit,qty:r2(b.qty),reason:'Expired (auto-logged)',cost:r2(i.cost*b.qty),ts:Date.now(),auto:true}); n++;
    });
    i.batches=i.batches.filter(b=>!(b.expiry&&daysUntil(b.expiry)<0));
  });
  if(n) save(); return n;
}

/* ---------------- SQUARE IMPORT ---------------- */
function parseCSV(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f);f=''; if(row.some(x=>x.trim()!=='')) rows.push(row); row=[]; }
    else f+=c;
  }
  row.push(f); if(row.some(x=>x.trim()!=='')) rows.push(row);
  return rows;
}
function parseDate(s){ s=String(s||'').trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return [+m[1],+m[2],+m[3]];
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))){ const a=+m[1],b=+m[2]; let y=+m[3]; if(y<100) y+=2000; return b>12?[y,a,b]:[y,b,a]; }
  return null; }
function parseTime(s){ const m=String(s||'').trim().match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*(am|pm)?/i); if(!m) return [12,0];
  let h=+m[1]; const ap=(m[3]||'').toLowerCase(); if(ap==='pm'&&h<12) h+=12; if(ap==='am'&&h===12) h=0; return [h,+m[2]]; }
const num=s=>parseFloat(String(s??'').replace(/[^0-9.\-]/g,''));

function importSquare(text,label){
  const rows=parseCSV(text);
  const hi=rows.findIndex(r=>{const h=r.map(x=>x.trim().toLowerCase());return h.includes('item')&&(h.includes('qty')||h.includes('quantity'));});
  if(hi<0) return {err:'Couldn\u2019t find the "Item" and "Qty" columns. In Square, export the Item Sales detail report (CSV or Excel).'};
  const h=rows[hi].map(x=>x.trim().toLowerCase());
  const col=(...n)=>{for(const x of n){const i=h.indexOf(x); if(i>=0) return i;} return -1;};
  const iD=col('date'),iT=col('time'),iI=col('item'),iQ=col('qty','quantity'),iG=col('gross sales','net sales','sales'),iX=col('transaction id','payment id');
  let added=0,dup=0,newItems=0,today=0;
  rows.slice(hi+1).forEach(r=>{
    const name=(r[iI]||'').trim(), qty=num(r[iQ]); if(!name||!qty) return;
    const dp=iD>=0?parseDate(r[iD]):null, tp=iT>=0?parseTime(r[iT]):[12,0];
    const ts=dp?new Date(dp[0],dp[1]-1,dp[2],tp[0],tp[1]).getTime():Date.now();
    const key=(iX>=0&&r[iX])?r[iX]+'|'+name:[r[iD],r[iT],name,r[iQ],r[iG]].join('|');
    if(db.importKeys[key]){dup++;return;} db.importKeys[key]=1;
    const gross=iG>=0?num(r[iG]):NaN;
    let m=db.menu.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!m){ m={id:cid(),name,price:gross>0?r2(gross/qty):0,recipe:[],src:'square',noPerishables:false}; db.menu.push(m); newItems++; }
    db.sales.push({id:cid(),menuId:m.id,qty,ts,rev:gross>0?gross:m.price*qty,src:'square'});
    if(ts>=db.settings.stockCountTs){ deductForSale(m,qty); today++; }
    added++;
  });
  if(added) db.settings.lastImport={ts:Date.now(),label,rows:added};
  return {added,dup,newItems,today};
}

function sampleCSV(){
  const base={'Flat White':[45,'Coffee',5],'Latte':[35,'Coffee',5],'Cappuccino':[20,'Coffee',5],'Oat Latte':[18,'Coffee',5.8],
    'Avo Toast':[14,'Food',16],'Eggs on Toast':[10,'Food',14],'Smashed Avo & Poached Eggs':[9,'Food',19.5],'Banana Bread':[12,'Food',6]};
  const rows=[['Date','Time','Category','Item','Qty','Price Point Name','Gross Sales','Transaction ID']];
  const now=new Date(), frac=Math.min(1,Math.max(0,(now.getHours()+now.getMinutes()/60-7)/8));
  for(let d=14;d>=0;d--){
    const day=new Date(Date.now()-d*DAY), dow=day.getDay();
    const f=(dow===0||dow===6)?1.25:dow===1?0.9:1, part=d===0?frac:1; if(part<=0) continue;
    const date=isoOf(day);
    for(const [item,[q,cat,price]] of Object.entries(base)){
      const qty=Math.round(q*f*part*(0.85+Math.random()*0.3)); if(qty<=0) continue;
      rows.push([date,d===0?'07:30:00':'12:00:00',cat,item,qty,'Regular','$'+(qty*price).toFixed(2),'DEMO-'+date+'-'+item.replace(/\W+/g,'')]);
    }
  }
  return rows.map(r=>r.map(c=>/[",\n]/.test(String(c))?'"'+String(c).replace(/"/g,'""')+'"':c).join(',')).join('\n');
}
function download(name,text){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }
function loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`)) return res(); const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function handleFile(f){
  try{
    let text;
    if(/\.xlsx?$/i.test(f.name)){
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}); text=XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]]);
    } else text=await f.text();
    const r=importSquare(text,'Square export ('+f.name+')');
    flash=r.err?r.err:`Imported ${r.added} sales line${r.added===1?'':'s'} from ${esc(f.name)}${r.dup?` (${r.dup} already imported, skipped)`:''}.`+
      (r.newItems?` ${r.newItems} new menu item${r.newItems>1?'s were':' was'} added. Check Setup in case they need a recipe.`:'')+
      (r.today?` Stock was updated for ${r.today} of today\u2019s sales.`:'');
  }catch(e){ flash='Couldn\u2019t read that file. Try exporting it from Square as CSV.'; }
  save(); render();
}

/* ---------------- FORECASTING ---------------- */
function completeDays(){ const t0=startOfDay(Date.now()), s=new Set(); db.sales.forEach(x=>{ if(x.ts<t0&&x.ts>=t0-14*DAY) s.add(isoOf(x.ts)); }); return s.size; }
function availableHistoryDays(){ const t0=startOfDay(Date.now()), s=new Set(); db.sales.forEach(x=>{ if(x.ts<t0) s.add(isoOf(x.ts)); }); return s.size; }
function usageNormal(){
  const t0=startOfDay(Date.now()), n=completeDays(), u={}; if(!n) return u;
  db.sales.forEach(s=>{ if(s.ts>=t0||s.ts<t0-14*DAY) return; const m=menuById(s.menuId); if(!m) return; m.recipe.forEach(r=>u[r.ing]=(u[r.ing]||0)+r.qty*s.qty); });
  for(const k in u) u[k]/=n; return u;
}
function salesHistory(){
  const t0=startOfDay(Date.now()), m={};
  db.sales.forEach(s=>{ if(s.ts>=t0||s.ts<t0-28*DAY) return; const k=isoOf(s.ts); m[k]=m[k]||{rev:0,qty:0,dow:new Date(s.ts).getDay()}; m[k].rev+=s.rev; m[k].qty+=s.qty; });
  return Object.values(m);
}
function baseForecast(){
  const past=salesHistory(); if(!past.length) return null;
  return {avgRev:sum(past,v=>v.rev)/past.length, avgQty:sum(past,v=>v.qty)/past.length, days:past.length};
}
/* Weekday pattern: average revenue on each weekday vs the overall daily average (last 4 weeks) */
function dowTable(){
  const past=salesHistory(), t={}; if(!past.length) return t;
  const avg=sum(past,v=>v.rev)/past.length; if(avg<=0) return t;
  for(let w=0;w<7;w++){ const x=past.filter(v=>v.dow===w); if(x.length) t[w]=Math.min(1.6,Math.max(0.5,(sum(x,v=>v.rev)/x.length)/avg)); }
  return t;
}
const eventsOn=d=>db.events.filter(e=>e.date===d);
const wdOf=k=>new Date(startOfDay(Date.now())+k*DAY+12*3600e3).getDay();
const dayName=iso=>new Date(iso+'T12:00:00').toLocaleDateString(undefined,{weekday:'short'});
const dayLabel=iso=>{ const d=daysUntil(iso); return d===0?'today':d===1?'tomorrow':new Date(iso+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}); };
/* Demand multiplier for day k from today: weekday pattern x weather (today) x events */
function dayFactor(k,tbl){
  let f=tbl[wdOf(k)]??1;
  if(k===0&&isWet()) f*=0.9;
  return f*Math.max(0.3,1+sum(eventsOn(addDaysISO(k)),e=>+e.uplift||0)/100);
}
/* Extra demand from owner inputs such as catering orders */
function extraUse(ingId,k){
  const d=addDaysISO(k);
  return sum((db.extras||[]).filter(x=>x.date===d),x=>sum(x.menuIds,mid=>{ const m=menuById(mid); return m?sum(m.recipe.filter(r=>r.ing===ingId),r=>r.qty*x.qty):0; }));
}
/* When would an order placed now arrive, and how long until the delivery after that? */
function deliveryPlan(i,cover){
  let lead=Math.max(0,+i.lead||1);
  if(i.cutoff){ const [h,m]=String(i.cutoff).split(':').map(Number), n=new Date(); if(n.getHours()*60+n.getMinutes()>h*60+(m||0)) lead+=1; }
  if(!i.days||!i.days.length) return {lead,cycle:cover,date:addDaysISO(lead)};
  let k=lead; while(!i.days.includes(wdOf(k))&&k<lead+14) k++;
  let k2=k+1; while(!i.days.includes(wdOf(k2))&&k2<k+14) k2++;
  return {lead:k,cycle:k2-k,date:addDaysISO(k)};
}
function factors(tbl){
  tbl=tbl||dowTable();
  const dowF=tbl[wdOf(0)]??1, wxF=isWet()?0.9:1;
  const evF=Math.max(0.3,1+sum(eventsOn(todayISO()),e=>+e.uplift||0)/100);
  return {dowF,wxF,evF,total:dowF*wxF*evF};
}
const openIngIds=()=>new Set(db.orders.filter(o=>o.status!=='received').flatMap(o=>o.lines.map(l=>l.ingId)));
const recentlyReceivedIngIds=()=>new Set(db.orders.filter(o=>o.status==='received'&&o.recvTs&&Date.now()-o.recvTs<12*3600e3).flatMap(o=>o.lines.map(l=>l.ingId)));

/* The agent: forecast each day until the next-but-one delivery, check stock + expiry batches, draft orders per supplier */
function analyse(){
  const u=usageNormal(), tbl=dowTable(), F=factors(tbl), busy=openIngIds(), receivedRecently=recentlyReceivedIngIds();
  const buf=1+(+db.settings.buffer||0)/100, cover=+db.settings.cover||1, H=45;
  const dfs=[...Array(H)].map((_,k)=>dayFactor(k,tbl));
  const plans=db.ingredients.map(i=>{
    const stock=stockOf(i), norm=u[i.id]||0;
    const dem=dfs.map((f,k)=>norm*f+extraUse(i.id,k)), fc=dem[0], has=dem.some(x=>x>0);
    const sumD=(a,b)=>sum(dem.slice(Math.max(0,a),Math.min(H,b)),x=>x);
    const dp=deliveryPlan(i,cover), lead=dp.lead, cyc=dp.cycle;
    let rem=stock, daysLeft=Infinity;
    if(has) for(let k=0;k<H;k++){ if(dem[k]>=rem){ daysLeft=k+(dem[k]>0?rem/dem[k]:0); break; } rem-=dem[k]; }
    let used=0,risk=0;
    if(has) [...i.batches].sort(byExp).forEach(b=>{ if(!b.expiry) return; const d=daysUntil(b.expiry);
      const cum=d<0?0:sumD(0,d)+(d<H?0.5*dem[d]:0), take=Math.min(b.qty,Math.max(0,cum-used)); used+=take; risk+=b.qty-take; });
    risk=r2(risk);
    const eb=[...i.batches].filter(b=>b.expiry).sort(byExp)[0];
    const next=eb?{d:daysUntil(eb.expiry),qty:eb.qty}:null;
    const untilDel=sumD(0,lead), nextCyc=sumD(lead,lead+cyc);
    const low=stock<=(+i.reorder||0), out=has&&daysLeft<lead+1, short=has&&(stock-risk)<untilDel+nextCyc;
    const onOrder=busy.has(i.id), justReceived=receivedRecently.has(i.id);
    const need=!onOrder&&(low||short)&&!(justReceived&&!out);
    let autoQty=0,why='',target=0;
    if(need){
      target=has?untilDel+nextCyc*buf:(+i.par||(+i.reorder||0)*2); let capped=false;
      if(i.perishable&&i.shelf&&has){ const cap=untilDel+sumD(lead,lead+(+i.shelf)); if(cap<target){target=cap;capped=true;} }
      autoQty=roundQty(i,target-(stock-risk));
      const p=[];
      if(out) p.push(`runs out in ~${fmt(daysLeft)} days, before the ${dayName(dp.date)} delivery`);
      else if(short) p.push(`won’t last until the following delivery: needs ~${fmt(untilDel+nextCyc)} ${i.unit}, has ${fmt(stock-risk)} usable`);
      else p.push('below reorder point');
      const drv=[];
      for(let k=0;k<lead+cyc;k++){ const d=addDaysISO(k);
        eventsOn(d).filter(e=>Math.abs(+e.uplift)>=5).forEach(e=>drv.push(`${e.name} ${dayName(d)} (${+e.uplift>=0?'+':''}${e.uplift}%)`));
        if(extraUse(i.id,k)>0) (db.extras||[]).filter(x=>x.date===d).forEach(x=>drv.push(`catering ${dayName(d)}`)); }
      if(drv.length) p.push('drivers: '+[...new Set(drv)].slice(0,3).join(', '));
      if(risk>0.05) p.push(`${fmt(risk)} ${i.unit} on hand will expire before it’s used`);
      if(capped) p.push(`capped to ${i.shelf}-day shelf life`);
      if(+i.pack>1||(+i.pack>0&&+i.pack<1)) p.push(`packs of ${i.pack}`);
      why=p.join(' · ');
    }
    const status=next&&next.d<0?'expired':out?'out':need?'order':risk>0.05?'risk':(next&&next.d<=2)?'exp':'ok';
    return {i,stock,norm,fc,daysLeft,risk,next,low,out,need,onOrder,justReceived,autoQty,why,status,dp,target,untilDel,nextCyc};
  });
  const g={};
  plans.forEach(p=>{
    if(!p.need||p.autoQty<=0) return;
    const s=p.i.supplier||'Unassigned supplier';
    g[s]=g[s]||{supplier:s,email:p.i.email||'',lines:[],total:0,delivery:p.dp.date,cutoff:p.i.cutoff||'',min:+p.i.minOrder||0};
    const ov=db.drafts[p.i.id], qty=ov!=null?ov:p.autoQty, skip=!!db.skip[p.i.id];
    g[s].lines.push({ingId:p.i.id,name:p.i.name,unit:p.i.unit,qty,auto:p.autoQty,edited:ov!=null&&ov!==p.autoQty,cost:p.i.cost,why:p.why,skip});
  });
  const groups=Object.values(g); groups.forEach(x=>x.total=sum(x.lines.filter(l=>!l.skip),l=>l.qty*l.cost));
  return {F,plans,groups};
}

/* ---------------- DECISION INTELLIGENCE ---------------- */
function dataReadiness(){
  const days=availableHistoryDays(), t0=startOfDay(Date.now()), recent=db.sales.filter(s=>s.ts<t0&&s.ts>=t0-28*DAY);
  const sold=sum(recent,s=>s.qty), mapped=sum(recent.filter(s=>{const m=menuById(s.menuId);return m&&m.recipe.length;}),s=>s.qty);
  const coverage=sold?Math.round(mapped/sold*100):0;
  const stock=Math.round(100*db.ingredients.filter(i=>i.batches&&i.batches.length&&(!i.perishable||i.shelf)).length/Math.max(1,db.ingredients.length));
  const external=(weather?10:0)+(eventsOn(todayISO()).length+eventsOn(addDaysISO(1)).length?10:4);
  const live=db.sales.some(s=>s.ts>=t0&&s.src!=='manual');
  let score=Math.max(15,Math.min(98,Math.round(Math.min(35,days/28*35)+coverage*.35+stock*.2+external)));
  if(!live) score=Math.min(79,score);
  const label=score>=80?'High':score>=60?'Medium':'Low';
  return {days,coverage,stock,score,label,sold,live};
}
function menuSpecials(A){
  const activePromos=new Map((db.promos||[]).filter(p=>p.active).map(p=>[p.menuId,p]));
  const ideas=[];
  A.plans.filter(p=>p.risk>0.05).forEach(p=>{
    db.menu.filter(m=>m.recipe.some(r=>r.ing===p.i.id)).forEach(m=>{
      const use=m.recipe.find(r=>r.ing===p.i.id).qty; if(!(use>0)) return;
      const units=Math.max(1,Math.ceil(p.risk/use)), d=p.next?p.next.d:4;
      const discount=d<=1?20:d<=2?15:10, cost=costOfItem(m), floor=Math.max(cost*1.5,cost/.7);
      const proposed=Math.min(m.price,Math.max(floor,Math.round(m.price*(1-discount/100)*2)/2));
      const actual=m.price>0?Math.max(0,Math.round((1-proposed/m.price)*100)):0;
      const saving=p.risk*p.i.cost, margin=proposed>0?Math.round((proposed-cost)/proposed*100):0;
      ideas.push({id:m.id,m,p,units,proposed,actual,cost,margin,saving,active:activePromos.get(m.id),score:saving+(d<=1?20:d<=2?10:0)+Math.max(0,margin)/10});
    });
  });
  const seen=new Set(); return ideas.sort((a,b)=>b.score-a.score).filter(x=>!seen.has(x.id)&&seen.add(x.id)).slice(0,3);
}
function ownerBriefing(A){
  const bf=baseForecast(), exp=bf?bf.avgRev*A.F.total:null, lines=A.groups.flatMap(g=>g.lines.filter(l=>!l.skip&&l.qty>0));
  const risky=A.plans.filter(p=>p.risk>0.05), activePromos=(db.promos||[]).filter(p=>p.active);
  const factor=Math.round((A.F.total-1)*100), out=[];
  out.push(`<strong>Plan for ${factor===0?'normal':Math.abs(factor)+'% '+(factor>0?'higher':'lower')} demand today</strong>${exp?` (${money(exp)} expected revenue)`:''}.`);
  out.push(lines.length?`Review <strong>${lines.length} draft item${lines.length===1?'':'s'}</strong> across ${A.groups.length} supplier${A.groups.length===1?'':'s'} before ordering.`:'No new supplier order needs approval.');
  out.push(risky.length?`Use <strong>${risky[0].i.name}</strong> first; ${fmt(risky[0].risk)} ${risky[0].i.unit} may expire unused.`:'No material expiry risk is forecast.');
  if(activePromos.length) out.push(`<strong>${activePromos.length} menu special${activePromos.length===1?' is':'s are'} active</strong> to move at-risk stock.`);
  return out;
}

function cleanJsonText(s){ return String(s||'').replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim(); }
async function runGeminiContext(){
  if(aiBusy) return;
  const key=(db.settings.geminiKey||'').trim(), input=(($('ai-context')||{}).value||'').trim();
  const status=$('ai-status'), button=$('ai-run');

    const prompt=`You are the CafeCast AI Demand Forecasting Agent for an independent café. Forecast TODAY'S total customer demand relative to a normal trading day by combining the supplied POS sales history, weekday pattern, weather, nearby events and optional owner note. The percentage you return must be the FINAL total change from normal, not an additional adjustment. Do not calculate stock orders or invent facts. Return JSON only with these fields: title (short string), demand_change_percent (integer from -60 to 100), summary (one sentence naming the most important drivers), next_step (one concrete preparation action for the owner), confidence ("Low", "Medium", or "High"). If evidence is weak, stay close to the weekday pattern and use Low confidence.\n\nCAFÉ DATA:\n${JSON.stringify(aiSnapshot())}\n\nOPTIONAL OWNER NOTE:\n${input||'None provided'}`;
    const response=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:0.2,responseMimeType:'application/json'}})
    });
    const data=await response.json();
    if(!response.ok) throw new Error((data.error&&data.error.message)||`Gemini request failed (${response.status})`);
    const raw=data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts&&data.candidates[0].content.parts[0]&&data.candidates[0].content.parts[0].text;
    if(!raw) throw new Error('Gemini returned no usable response. Please try again.');

    const brief={title:String(result.title||'AI demand forecast'),appliesTo:'today',uplift,signal:calibrated,summary:String(result.summary||'Gemini combined the available demand signals.'),nextStep:String(result.next_step||'Review the refreshed plan.'),confidence:['Low','Medium','High'].includes(result.confidence)?result.confidence:'Medium',input,ts:Date.now(),model};
    db.events=db.events.filter(e=>!e.ai).concat({id:cid(),date:todayISO(),name:brief.title,uplift:calibrated,auto:false,cal:true,ai:true,src:`Gemini · ${model}`});
    db.aiBrief=brief;

async function scanEvents(force){
  const s=db.settings, t=todayISO(), tm=addDaysISO(1);

  try{
    const y=new Date().getFullYear();

    hs.filter(h=>(h.date===t||h.date===tm)&&(h.global||!h.counties||h.counties.includes(s.state)))
      .forEach(h=>found.push({date:h.date,name:h.localName||h.name,uplift:+s.holidayUplift||0,src:'Public holiday'}));
    notes.push('public holidays');
  }catch(e){}
  if(s.tmKey){

      const url=`https://app.ticketmaster.com/discovery/v2/events.json?apikey=${encodeURIComponent(s.tmKey)}&latlong=${s.lat},${s.lon}&radius=3&unit=km&startDateTime=${t}T00:00:00Z&endDateTime=${addDaysISO(2)}T00:00:00Z&size=50&sort=date,asc`;
      const d=await (await fetch(url)).json(), by={};
      ((d._embedded&&d._embedded.events)||[]).forEach(e=>{ const dt=e.dates&&e.dates.start&&e.dates.start.localDate; if(dt===t||dt===tm){ (by[dt]=by[dt]||[]).push(e.name); } });
      Object.entries(by).forEach(([dt,names])=>found.push({date:dt,name:names.length===1?names[0]:`${names.length} events within 3 km (e.g. ${names[0]})`,uplift:Math.min(25,5*names.length),src:'Ticketmaster'}));
      notes.push('Ticketmaster events');
    }catch(e){}
  }
  db.events=db.events.filter(e=>!e.auto&&e.date>=t).concat(found.filter(f=>!db.dismissed[f.date+'|'+f.name]).map(f=>({...f,id:cid(),auto:true})));
  s.lastScan=t; s.scanNote=notes.length?`Checked ${notes.join(' and ')} online`:'Couldn\u2019t reach the events services';
  save(); softRender();
}

let approving=false;
async function approve(sup){
  if(approving) return;
  approving=true;
  try{
    const A=analyse(), made=[], alreadyOpen=openIngIds();
    for(const g of A.groups.filter(x=>!sup||x.supplier===sup)){
      const lines=g.lines.filter(l=>!l.skip&&l.qty>0&&!alreadyOpen.has(l.ingId)).map(l=>({ingId:l.ingId,name:l.name,unit:l.unit,qty:l.qty,cost:l.cost}));
      g.lines.forEach(l=>{delete db.drafts[l.ingId]; delete db.skip[l.ingId];});
      if(!lines.length) continue;
      const o={id:'PO-'+String(Date.now()).slice(-5)+cid().slice(0,2).toUpperCase(),supplier:g.supplier,email:g.email,lines,total:poTotal(lines),ts:Date.now(),status:'approved',delivery:g.delivery||null};
      db.orders.push(o); made.push(o);
      lines.forEach(l=>alreadyOpen.add(l.ingId));
      if(db.settings.mode==='auto'&&db.settings.webhook){
        try{ await fetch(db.settings.webhook,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...o,message:poText(o)})}); o.status='submitted'; }catch(e){}
      }
    }
    if(made.length){
      const auto=made.every(o=>o.status==='submitted');
      flash=`${made.length} order${made.length>1?'s':''} approved (${money(sum(made,o=>o.total))}). `+(auto?'Sent to your suppliers automatically.':'They are now awaiting delivery. Tap \u2709 Email on each order below to send it to the supplier.');
      active='orders';
    }else flash='No new draft items were approved. Existing open orders remain under Awaiting delivery.';
    save(); render();
  }finally{
    approving=false;
  }
}
function receive(id){
  const o=db.orders.find(x=>x.id===id); if(!o) return;
  o.lines.forEach(l=>{ const i=ingById(l.ingId); if(i) addBatch(i,l.qty,newExpiry(i)); });
  o.status='received'; o.recvTs=Date.now();
  const remaining=analyse().groups.flatMap(g=>g.lines.filter(l=>!l.skip&&l.qty>0)).length;

  const lines=A.groups.flatMap(g=>g.lines.filter(l=>!l.skip&&l.qty>0).map(l=>({...l,supplier:g.supplier,delivery:g.delivery})));
  const total=sum(A.groups,g=>g.total);

}

function recs(A){
  const out=[], t0=startOfDay(Date.now());
  const lines=A.groups.flatMap(g=>g.lines.filter(l=>!l.skip&&l.qty>0));
  if(lines.length){ const tot=sum(A.groups,g=>g.total);
    out.push({html:`Order <strong>${lines.length} item${lines.length>1?'s':''}</strong> from ${A.groups.length} supplier${A.groups.length>1?'s':''} (${money(tot)}) so you don\u2019t run out: ${lines.map(l=>esc(l.name)).join(', ')}.`,act:'order'}); }
  const risky=A.plans.filter(p=>p.risk>0.05).sort((a,b)=>b.risk*b.i.cost-a.risk*a.i.cost).slice(0,4);
  if(risky.length){
    const items=risky.map(p=>{ const dishes=db.menu.filter(m=>m.recipe.some(r=>r.ing===p.i.id)).map(m=>esc(m.name)).slice(0,2);
      return `<strong>${esc(p.i.name)}</strong> ~${fmt(p.risk)} ${esc(p.i.unit)} (${money(p.risk*p.i.cost)})${dishes.length?`: push ${dishes.join(' or ')}`:''}`; });
    out.push({html:`Use first. At the current pace this stock will expire before it\u2019s used, so promote dishes that use it:<br>${items.join('<br>')}`});
  }
  const wk={}; db.waste.filter(w=>Date.now()-w.ts<7*DAY).forEach(w=>wk[w.name]=(wk[w.name]||0)+w.cost);
  const top=Object.entries(wk).sort((a,b)=>b[1]-a[1])[0];
  if(top&&top[1]>0) out.push({html:`<strong>${esc(top[0])}</strong> is your biggest waste this week (${money(top[1])}). CafeCast now orders it closer to forecast demand.`});
  if(A.F.wxF<1) out.push({html:'Rain expected: plan for roughly 10% fewer customers and prep lighter.'});
  eventsOn(todayISO()).forEach(e=>out.push({html:`<strong>${esc(e.name)}</strong> today: expect about ${(+e.uplift>=0?'+':'')+e.uplift}% demand. Key items are already factored into the order.`}));
  [1,2,3,4,5,6,7].forEach(k=>eventsOn(addDaysISO(k)).filter(e=>Math.abs(+e.uplift)>=10).forEach(e=>out.push({html:`Heads up: <strong>${esc(e.name)}</strong> ${dayLabel(e.date)} (${(+e.uplift>=0?'+':'')+e.uplift}% demand). Already in the order forecast.`})));
  (db.extras||[]).filter(x=>{const d=daysUntil(x.date);return d>=0&&d<=7;}).forEach(x=>out.push({html:`Catering ${dayLabel(x.date)}: <strong>${esc(x.text)}</strong>. Added to the ingredient forecast.`}));
  (db.notes||[]).filter(n=>{const d=daysUntil(n.date);return d>=0&&d<=10;}).forEach(n=>out.push({html:`<span class="badge">${esc(n.type)}</span> ${esc(n.text)} <span class="muted">(${esc(n.by)}, ${dayLabel(n.date)})</span>`}));
  const unmapped=db.menu.filter(m=>needsRecipe(m)&&db.sales.some(s=>s.menuId===m.id&&s.ts>t0-14*DAY));
  if(unmapped.length) out.push({html:`${unmapped.length} item${unmapped.length>1?'s':''} from Square (${unmapped.slice(0,3).map(m=>esc(m.name)).join(', ')}) ${unmapped.length>1?'have':'has'} no recipe yet, so ingredient use isn\u2019t counted.`,act:'setup'});
  if(!out.length) out.push({html:'All good. Stock is healthy and nothing needs your attention today.'});
  return out;
}

function pills(p){
  const m={expired:['low','Expired'],out:['low','Running out'],order:['mid','Order due'],risk:['mid','May expire unused'],exp:['mid','Expiring soon'],ok:['ok','OK']}[p.status];
  return `<span class="pill ${m[0]}">${m[1]}</span>${p.onOrder?'<span class="pill info">Awaiting delivery</span>':''}${p.justReceived?'<span class="pill ok">Received today</span>':''}`;
}
function batchList(p){
  const bs=[...p.i.batches].sort(byExp); if(!bs.length) return '<span class="muted">\u2013</span>';
  return bs.map(b=>{const d=daysUntil(b.expiry);return `<div${d!==null&&d<=1?' style="color:var(--warn)"':''}>${fmt(b.qty)} ${esc(p.i.unit)} ${b.expiry?expLabel(d):'<span class="muted">no expiry</span>'}</div>`;}).join('');
}

function orderCalculation(l,p){
  if(!p) return '';
  const usable=Math.max(0,p.stock-p.risk), raw=Math.max(0,p.target-usable), pack=+p.i.pack||0;
  return `<div class="calc-grid"><div class="calc-step"><span>Required cover</span><strong>${fmt(p.target,2)} ${esc(p.i.unit)}</strong></div><div class="calc-step"><span>Usable stock</span><strong>− ${fmt(usable,2)} ${esc(p.i.unit)}</strong></div><div class="calc-step"><span>Recommended order</span><strong>${fmt(l.auto,2)} ${esc(p.i.unit)}</strong></div></div>
    <div class="calc-note">Raw shortage: ${fmt(raw,2)} ${esc(p.i.unit)}. ${pack?`Rounded to supplier packs of ${fmt(pack,2)} ${esc(p.i.unit)}. `:''}Required cover includes the next supplier cycle and the ${fmt(+db.settings.buffer||0)}% safety buffer.${l.edited?` The owner adjusted this line to ${fmt(l.qty,2)} ${esc(p.i.unit)}.`:''}</div>`;
}

function renderWaste(A){
  const expiredQty=p=>r2(sum(p.i.batches.filter(b=>b.expiry&&daysUntil(b.expiry)<=0),b=>b.qty));
  const per=A.plans.filter(p=>p.i.perishable).sort((a,b)=>(a.next?a.next.d:99)-(b.next?b.next.d:99)||b.risk*b.i.cost-a.risk*a.i.cost);
  const risks=A.plans.filter(p=>p.i.perishable&&p.risk>0.05).sort((a,b)=>(a.next?a.next.d:99)-(b.next?b.next.d:99)||b.risk*b.i.cost-a.risk*a.i.cost);
  const attention=per.filter(p=>expiredQty(p)>0||p.risk>0.05);
  const check=db.wasteChecks[todayISO()];
  const t0=startOfDay(Date.now());
  const recent=[...db.waste].reverse().slice(0,15);
  const reasons=['Spoiled / expired','Over-prepped','Customer return','Spillage / error'];
  const opts=sel=>reasons.map(r=>`<option${r===sel?' selected':''}>${r}</option>`).join('');
  return `
  <div class="card anchor-target" id="expiry-watchlist">
    <div class="panel-title"><h2>${icon('clock')} Expiry risk watchlist</h2><span class="pill ${risks.length?'mid':'ok'}">${risks.length} forecast risk${risks.length===1?'':'s'}</span></div>
    <p class="lead">Forward-looking stock that CafeCast expects may expire before it can be used. This is a forecast—not confirmed waste.</p>
    <div class="tbl-wrap"><table>
      <tr><th>Priority</th><th>Item</th><th>Forecast unused</th><th>Earliest expiry</th><th>Value exposed</th><th>Suggested response</th></tr>
      ${risks.map((p,ix)=>`<tr><td><span class="pill ${p.next&&p.next.d<=1?'low':'mid'}">${p.next&&p.next.d<=0?'Today':p.next&&p.next.d===1?'Tomorrow':`#${ix+1}`}</span></td><td><strong>${esc(p.i.name)}</strong></td><td>${fmt(p.risk)} ${esc(p.i.unit)}</td><td>${p.next?(p.next.d<=0?'Today':p.next.d===1?'Tomorrow':`In ${p.next.d} days`):'Check date'}</td><td>${money(p.risk*p.i.cost)}</td><td>${db.menu.some(m=>m.recipe.some(r=>r.ing===p.i.id))?'Use first or run a menu special':'Use first and reduce the next order'}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No stock is forecast to expire unused.</td></tr>'}
    </table></div>
  </div>
  <div class="card anchor-target" id="closing-check">
    <h2>End-of-shift waste check</h2>
    <p class="lead">CafeCast has reduced the check to ${attention.length} item${attention.length===1?'':'s'} needing attention, ordered by expiry. Record a quantity only if it was actually discarded; otherwise leave it blank. ${check?`<strong>Done today at ${timeStr(check)}.</strong>`:''}</p>
    <div class="attention-note">${icon('plan')}<div><strong>Exception-based check</strong><div class="muted">Items without an expiry or waste signal are hidden. Use “Log something else” only for spills, returns or unexpected waste.</div></div></div>
    <div class="tbl-wrap"><table>
      <tr><th>Item</th><th>In stock</th><th>CafeCast flag</th><th>Confirm discarded</th><th>Reason</th></tr>
      ${attention.map(p=>{ const today=expiredQty(p);
        return `<tr><td>${esc(p.i.name)}</td><td>${fmt(p.stock)} ${esc(p.i.unit)}</td>
        <td>${today>0?`<span class="pill low">${fmt(today)} ${esc(p.i.unit)} expired</span>`:`<span class="pill mid">${fmt(p.risk)} ${esc(p.i.unit)} forecast risk</span>`}</td>
        <td style="white-space:nowrap"><input class="qin" type="number" min="0" step="${stepFor(p.i.unit)}" data-wq="${p.i.id}" value="${today>0?today:''}" placeholder="Check"> ${esc(p.i.unit)}</td>
        <td><select data-wr="${p.i.id}">${opts('Spoiled / expired')}</select></td></tr>`;}).join('')||'<tr><td colspan="5" class="empty">No items require attention. Confirm a clean close below.</td></tr>'}
    </table></div>
    <div class="actions"><button class="btn ghost" data-act="waste-none">Nothing discarded</button><button class="btn" data-act="waste-save">Confirm & save</button></div>
    <details><summary>Log something else (non-perishable, spill, etc.)</summary>
      <div class="row">
        <div class="field"><label>Item</label><select id="wo-ing">${db.ingredients.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')}</select></div>
        <div class="field"><label>Qty</label><input id="wo-qty" type="number" step="0.1"></div>
        <div class="field"><label>Reason</label><select id="wo-reason">${opts('Spillage / error')}</select></div>
        <button class="btn secondary" data-act="waste-other">Log</button>
      </div>
    </details>
  </div>
  <div class="card anchor-target" id="waste-log">
    <h2>Waste log</h2>
    <p class="lead">This week: <strong>${money(sum(db.waste.filter(w=>Date.now()-w.ts<7*DAY),w=>w.cost))}</strong> wasted. Today: ${money(sum(db.waste.filter(w=>w.ts>=t0),w=>w.cost))}.</p>
    <div class="tbl-wrap"><table>
      <tr><th>When</th><th>Item</th><th>Qty</th><th>Cost</th><th>Reason</th></tr>
      ${recent.map(w=>`<tr><td class="muted">${dayTimeStr(w.ts)}</td><td>${esc(w.name)}</td><td>${fmt(w.qty,2)} ${esc(w.unit)}</td><td>${money(w.cost)}</td><td>${esc(w.reason)}${w.auto?' <span class="badge">auto</span>':''}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No waste logged</td></tr>'}
    </table></div>
  </div>`;
}
function saveWasteCheck(none){
  let n=0,c=0;
  if(!none) document.querySelectorAll('[data-wq]').forEach(inp=>{ const q=parseFloat(inp.value); if(!(q>0)) return; const i=ingById(inp.dataset.wq); if(!i) return;
    const rs=document.querySelector(`[data-wr="${inp.dataset.wq}"]`); const before=db.waste.length; logWaste(i,q,rs?rs.value:'Spoiled / expired',false); n++; c+=db.waste[before].cost; });
  db.wasteChecks[todayISO()]=Date.now();
  flash=none?'Waste check saved: nothing wasted today. Nice.':`Waste check saved: ${n} item${n===1?'':'s'}, ${money(c)}. Stock updated.`;
  save(); render();
}

        <div class="field" style="flex:0 1 130px"><label>Qty per item</label><input id="rec-qty" type="number" step="0.01" placeholder="e.g. 0.2"></div>
        <button class="btn secondary" data-act="rec-add">Add</button>
      </div>
      <div class="row">
        <div class="field"><label>Or copy the recipe from</label><select id="rec-copy">${db.menu.filter(m=>m.id!==em.id&&m.recipe.length).map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div>
        <button class="btn ghost" data-act="rec-copy">Copy</button>
      </div>
      <label style="display:flex;gap:8px;align-items:center;margin:4px 0 0;font-size:.88rem;color:var(--ink)"><input type="checkbox" id="rec-noper" ${em.noPerishables?'checked':''}> This item has no perishable ingredients (e.g. bought-in pastries)</label>
    </div>`:'<div class="empty">No menu items yet. Sync sales from Square to add them.</div>'}
    <div class="row" style="margin-top:14px">
      <input id="menu-search" placeholder="Search ${db.menu.length} items\u2026" style="flex:2;min-width:160px">
      <select id="menu-filter" style="flex:1;min-width:140px"><option value="all">All items</option><option value="need">Needs a recipe</option></select>
    </div>
    <div class="tbl-wrap"><table>
      <tr><th>Item</th><th>Price</th><th>Ingredient cost</th><th>Margin</th><th>Recipe</th><th>Sold (14d)</th><th></th></tr>
      ${menuSorted.map(m=>{const c=costOfItem(m),pct=m.price>0?(m.price-c)/m.price*100:0;
        return `<tr data-menu-row="${esc(m.name.toLowerCase())}" data-need="${needsRecipe(m)?1:0}"><td>${esc(m.name)} ${m.src==='square'?'<span class="badge">from Square</span>':''}</td><td>${money(m.price)}</td><td>${m.recipe.length?money(c):'\u2013'}</td><td>${m.recipe.length?pct.toFixed(0)+'%':'\u2013'}</td>
        <td class="muted">${m.recipe.length?m.recipe.map(r=>{const i=ingById(r.ing);return `${i?esc(i.name):'?'} \u00d7${r.qty}`;}).join(', '):(m.noPerishables?'No perishables':'<span style="color:var(--amber)">Needs recipe</span>')}</td>
        <td>${sold(m.id)}</td><td style="white-space:nowrap"><button class="btn ghost" data-act="edit-menu" data-id="${m.id}">Edit</button> <button class="del" data-act="del-menu" data-id="${m.id}">\u2715</button></td></tr>`;}).join('')}
    </table></div>
  </div>

  <div class="card">
    <h2>Stock items</h2>
    <p class="lead">Edit directly in the table. Changing <em>Stock</em> works as a quick stock count. Shelf life sets the expiry date of each new delivery.</p>
    <div class="tbl-wrap"><table class="edit-tbl">
      <tr><th>Name</th><th>Perishable</th><th>Shelf life (days)</th><th>Stock</th><th>Unit</th><th>Reorder at</th><th>Delivery (days)</th><th>Cost/unit</th><th>Supplier</th><th>Supplier email</th><th></th></tr>
      ${db.ingredients.map(i=>`<tr>
        <td><input class="w-txt" data-ingf="${i.id}:name" value="${esc(i.name)}"></td>
        <td><input type="checkbox" data-ingf="${i.id}:perishable" ${i.perishable?'checked':''}></td>
        <td><input class="w-num" type="number" data-ingf="${i.id}:shelf" value="${i.shelf??''}"></td>
        <td><input class="w-num" type="number" step="0.1" data-ingf="${i.id}:stock" value="${stockOf(i)}"></td>
        <td><input class="w-num" data-ingf="${i.id}:unit" value="${esc(i.unit)}"></td>
        <td><input class="w-num" type="number" step="0.1" data-ingf="${i.id}:reorder" value="${i.reorder??''}"></td>
        <td><input class="w-num" type="number" data-ingf="${i.id}:lead" value="${i.lead??''}"></td>
        <td><input class="w-num" type="number" step="0.01" data-ingf="${i.id}:cost" value="${i.cost??''}"></td>
        <td><input class="w-txt" data-ingf="${i.id}:supplier" value="${esc(i.supplier)}"></td>
        <td><input class="w-mail" data-ingf="${i.id}:email" value="${esc(i.email)}"></td>
        <td><button class="del" data-act="del-ing" data-id="${i.id}">\u2715</button></td></tr>`).join('')}
    </table></div>
    <details><summary>+ Add a stock item</summary>
      <div class="row">
        <div class="field"><label>Name</label><input id="ni-name" placeholder="e.g. Almond milk"></div>
        <div class="field"><label>Unit</label><input id="ni-unit" placeholder="L / kg / ea"></div>
        <div class="field"><label>Stock now</label><input id="ni-stock" type="number" step="0.1"></div>
        <div class="field"><label>Shelf life (days)</label><input id="ni-shelf" type="number"></div>
        <div class="field"><label>Reorder at</label><input id="ni-reorder" type="number" step="0.1"></div>
        <div class="field"><label>Delivery (days)</label><input id="ni-lead" type="number" value="1"></div>
        <div class="field"><label>Cost/unit ($)</label><input id="ni-cost" type="number" step="0.01"></div>
        <div class="field"><label>Supplier</label><input id="ni-supplier"></div>
        <div class="field"><label>Supplier email</label><input id="ni-email"></div>
      </div>
      <label style="display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--ink)"><input type="checkbox" id="ni-per" checked> Perishable</label>
      <button class="btn" data-act="add-ing" style="margin-top:10px">Add item</button>
    </details>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>Sending orders to suppliers</h2>
      <p class="lead">When you approve an order, how should it reach the supplier?</p>
      <div class="field"><select data-set="mode" style="width:100%">
        <option value="email"${st.mode!=='auto'?' selected':''}>Email: I tap Send in my email app (simplest)</option>
        <option value="auto"${st.mode==='auto'?' selected':''}>Automatic: send through a Power Automate flow (advanced)</option></select></div>
      ${st.mode==='auto'?`<div class="field" style="margin-top:12px"><label>Power Automate flow URL</label><input data-set="webhook" style="width:100%" placeholder="https://prod-xx.australiasoutheast.logic.azure.com/\u2026" value="${esc(st.webhook)}">
        <div class="help">Create a flow with the trigger \u201cWhen an HTTP request is received\u201d that emails the supplier, then paste its URL here. Without a URL, orders fall back to email.</div></div>`:''}
      <h3>How much to order</h3>
      <div class="row">
        <div class="field"><label>Safety buffer %</label><input data-set="buffer" type="number" value="${st.buffer}"><div class="help">Extra on top of the forecast for busy surprises.</div></div>
        <div class="field"><label>Days each delivery should last</label><input data-set="cover" type="number" value="${st.cover}"><div class="help">Perishables are always capped at their shelf life.</div></div>
      </div>
    </div>
    <div class="card">
      <h2>Location & local events</h2>
      <p class="lead">Used to fetch the weather and to search online for public holidays and nearby events.</p>
      <div class="row"><div class="field"><label>Caf\u00e9 suburb</label><input id="geo-q" value="${esc(st.place)}"></div><button class="btn secondary" data-act="geo">Set</button></div>
      <div class="row">
        <div class="field"><label>Public holiday demand change %</label><input data-set="holidayUplift" type="number" value="${st.holidayUplift}"><div class="help">Use a negative number if your caf\u00e9 is quieter on holidays (e.g. CBD).</div></div>
        <div class="field"><label>Ticketmaster API key (optional)</label><input data-set="tmKey" value="${esc(st.tmKey)}" placeholder="Free from developer.ticketmaster.com"><div class="help">Lets the agent also find concerts, games and shows within 3 km.</div></div>
      </div>
    </div>
  </div>

  <div class="card ai-card">
    <div class="ai-head"><div><h2>${icon('plan')} CafeCast AI demand forecasting</h2><p class="lead">Gemini combines POS history, weekday patterns, weather, events and optional owner knowledge to forecast demand. CafeCast then uses explainable formulas for stock, expiry and supplier-order calculations.</p></div><span class="pill ${st.geminiKey?'ok':'mid'}">${st.geminiKey?'Connected':'Setup needed'}</span></div>
    <div class="row">
      <div class="field"><label>Gemini API key</label><input data-set="geminiKey" type="password" autocomplete="off" value="${esc(st.geminiKey||'')}" placeholder="Paste your Google AI Studio key"><div class="help">For this PoC the key is stored only in this browser. Move it to a protected backend before production.</div></div>
      <div class="field" style="max-width:230px"><label>Model</label><select data-set="geminiModel"><option value="gemini-2.5-flash"${st.geminiModel==='gemini-2.5-flash'?' selected':''}>Gemini 2.5 Flash</option><option value="gemini-2.5-flash-lite"${st.geminiModel==='gemini-2.5-flash-lite'?' selected':''}>Gemini 2.5 Flash-Lite</option></select><div class="help">Flash is the recommended demo model.</div></div>
    </div>
    <a class="btn ghost" href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">Get a free API key ↗</a>
  </div>

  <div class="card">
    <h2>Data</h2>
    <p class="lead">You\u2019re using <strong>${DATASETS[DS]}</strong>. Each dataset is saved separately in this browser, so changes here never affect the other one. Switch datasets at the top of the page. Resetting only reloads this dataset\u2019s original data.</p>
    <button class="btn ghost" data-act="reset-demo">Reset this dataset</button> <button class="btn danger" data-act="clear-all">Start empty</button>
  </div>`;
}
function filterMenu(){
  const q=(($('menu-search')||{}).value||'').toLowerCase(), f=($('menu-filter')||{}).value||'all';
  document.querySelectorAll('[data-menu-row]').forEach(r=>{ r.style.display=r.dataset.menuRow.includes(q)&&(f==='all'||r.dataset.need==='1')?'':'none'; });
}

/* ---------------- EVENTS ---------------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id;
  if(b.tagName==='A'&&b.getAttribute('href')==='#') e.preventDefault();
  switch(act){
    case 'tab': active=id; window.scrollTo(0,0); render(); break;
    case 'jump': active='today'; render(); requestAnimationFrame(()=>{ const target=$(id); if(target) target.scrollIntoView({behavior:'smooth',block:'start'}); }); break;
    case 'jump-page': active=b.dataset.page||'today'; render(); requestAnimationFrame(()=>{ const target=$(id); if(target){ target.scrollIntoView({behavior:'smooth',block:'start'}); target.classList.add('anchor-flash'); setTimeout(()=>target.classList.remove('anchor-flash'),1200); } }); break;
    case 'scan': runAgent(true); break;
    case 'ai-context': await runGeminiContext(); break;
    case 'approve-all': await approve(null); break;
    case 'approve-sup': await approve(b.dataset.sup); break;
    case 'reset-drafts': db.drafts={}; db.skip={}; save(); render(); break;
    case 'recv': { const o=db.orders.find(x=>x.id===id); if(!o) break;
      const early=o.delivery&&daysUntil(o.delivery)>0;
      if(early&&!confirm(`This delivery is due ${dayLabel(o.delivery)}. Mark it received early?`)) break;
      receive(id); break; }
    case 'cancel-order': if(confirm('Cancel this order?')){ db.orders=db.orders.filter(o=>o.id!==id); save(); render(); } break;
    case 'waste-fill': { const inp=document.querySelector(`[data-wq="${id}"]`); if(inp) inp.value=b.dataset.qty; break; }
    case 'waste-save': saveWasteCheck(false); break;
    case 'waste-none': saveWasteCheck(true); break;
    case 'waste-other': { const i=ingById($('wo-ing').value), q=parseFloat($('wo-qty').value); if(i&&q>0){ logWaste(i,q,$('wo-reason').value,false); flash=`Logged ${q} ${esc(i.unit)} ${esc(i.name)}.`; save(); render(); } break; }
    case 'sample-dl': download('square-item-sales-sample.csv',sampleCSV()); break;
    case 'manual-sale': { const m=menuById($('sl-item').value), q=parseInt($('sl-qty').value)||1; if(!m) break;
      db.sales.push({id:cid(),menuId:m.id,qty:q,ts:Date.now(),rev:m.price*q,src:'manual'}); deductForSale(m,q); flash=`Added ${q} \u00d7 ${esc(m.name)}.`; save(); render(); break; }
    case 'ev-add': { const n=$('ev-name').value.trim(); if(!n) break; db.events.push({id:cid(),date:todayISO(),name:n,uplift:parseFloat($('ev-up').value)||20,auto:false}); save(); render(); break; }
    case 'ctx-add': { const n=$('ctx-name').value.trim(); if(!n){ flash='Describe the event or condition first.'; render(); break; } db.events.push({id:cid(),date:$('ctx-date').value,name:n,uplift:parseFloat($('ctx-up').value)||0,auto:false,cal:true,src:'Owner input'}); flash=`Owner context added: ${esc(n)} is now included in the forecast.`; save(); render(); break; }
    case 'ev-del': { const ev=db.events.find(x=>x.id===id); if(ev&&ev.auto) db.dismissed[ev.date+'|'+ev.name]=1; db.events=db.events.filter(x=>x.id!==id); save(); render(); break; }
    case 'promo-toggle': { db.promos=db.promos||[]; const old=db.promos.find(p=>p.menuId===b.dataset.menu&&p.active); if(old){ old.active=false; flash=`Paused the ${esc((menuById(old.menuId)||{}).name||'menu')} special.`; } else { db.promos.filter(p=>p.menuId===b.dataset.menu).forEach(p=>p.active=false); const m=menuById(b.dataset.menu); db.promos.push({id:cid(),menuId:b.dataset.menu,price:parseFloat(b.dataset.price)||0,reason:b.dataset.reason||'',active:true,ts:Date.now()}); flash=`Special approved: ${esc(m?m.name:'menu item')} at ${money(parseFloat(b.dataset.price)||0)}. In production this would sync to the POS after approval.`; } save(); render(); break; }
    case 'edit-menu': editMenu=id; render(); { const el=$('rec-editor'); if(el) el.scrollIntoView({behavior:'smooth'}); } break;
    case 'rec-add': { const m=menuById(editMenu), q=parseFloat($('rec-qty').value), ing=$('rec-ing').value; if(!m||!(q>0)) break; m.recipe.push({ing,qty:q}); m.noPerishables=false; save(); render(); break; }
    case 'rec-del': { const m=menuById(editMenu); if(m){ m.recipe.splice(+b.dataset.idx,1); save(); render(); } break; }
    case 'rec-copy': { const m=menuById(editMenu), src=menuById(($('rec-copy')||{}).value); if(m&&src){ m.recipe=src.recipe.map(r=>({...r})); m.noPerishables=false; flash=`Copied the ${esc(src.name)} recipe to ${esc(m.name)}.`; save(); render(); } break; }
    case 'del-menu': if(confirm('Remove this menu item?')){ db.menu=db.menu.filter(m=>m.id!==id); save(); render(); } break;
    case 'del-ing': if(confirm('Remove this stock item? It will also be removed from recipes.')){ db.ingredients=db.ingredients.filter(i=>i.id!==id); db.menu.forEach(m=>m.recipe=m.recipe.filter(r=>r.ing!==id)); save(); render(); } break;
    case 'add-ing': { const name=$('ni-name').value.trim(); if(!name){ alert('Name required'); break; }
      const i={id:cid(),name,unit:$('ni-unit').value.trim()||'ea',cost:parseFloat($('ni-cost').value)||0,supplier:$('ni-supplier').value.trim(),email:$('ni-email').value.trim(),
        reorder:parseFloat($('ni-reorder').value)||0,par:null,lead:parseFloat($('ni-lead').value)||1,shelf:parseFloat($('ni-shelf').value)||null,perishable:$('ni-per').checked,batches:[]};
      addBatch(i,parseFloat($('ni-stock').value)||0,newExpiry(i)); db.ingredients.push(i); flash=`Added ${esc(name)}.`; save(); render(); break; }
    case 'geo': geocode(); break;
    case 'reset-demo': if(confirm(`Reset ${DATASETS[DS]} to its original data? The other dataset isn\u2019t affected.`)){ seed(); weather=null; editMenu=null; save(); runAgent(true); } break;
    case 'clear-all': if(confirm('Delete all data and start with an empty caf\u00e9?')){ const keep=db.settings; seed(); Object.assign(db,{ingredients:[],menu:[],sales:[],waste:[],orders:[],events:[],importKeys:{}});
      db.settings.lastImport=null; db.settings.place=keep.place; db.settings.lat=keep.lat; db.settings.lon=keep.lon; save(); render(); } break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ') return;
  const target=e.target.closest('[data-act][role="button"]');
  if(!target) return;
  e.preventDefault(); target.click();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.ingf){ const [id,f]=t.dataset.ingf.split(':'), i=ingById(id); if(!i) return;
    if(f==='perishable') i.perishable=t.checked;
    else if(f==='stock') setStock(i,Math.max(0,parseFloat(t.value)||0));
    else if(['shelf','reorder','lead','cost'].includes(f)) i[f]=t.value===''?null:parseFloat(t.value);
    else i[f]=t.value.trim();
    save(); render(); return; }
  if(t.dataset.menuf){ const [id,f]=t.dataset.menuf.split(':'), m=menuById(id); if(m){ m[f]=parseFloat(t.value)||0; save(); render(); } return; }
  if(t.dataset.draft){ const v=parseFloat(t.value); db.drafts[t.dataset.draft]=isNaN(v)?0:Math.max(0,v); save(); render(); return; }
  if(t.dataset.skip){ if(t.checked) delete db.skip[t.dataset.skip]; else db.skip[t.dataset.skip]=true; save(); render(); return; }
  if(t.dataset.set){ const k=t.dataset.set; db.settings[k]=['buffer','cover','holidayUplift'].includes(k)?(parseFloat(t.value)||0):t.value.trim();
    if(k==='mode') db.settings.modeSet=true; if(k==='tmKey'||k==='holidayUplift'){ db.settings.lastScan=null; scanEvents(true); } save(); render(); return; }
  if(t.id==='rec-item'){ editMenu=t.value; render(); return; }
  if(t.id==='rec-noper'){ const m=menuById(editMenu); if(m){ m.noPerishables=t.checked; save(); render(); } return; }
  if(t.id==='ds-pick'){ save(); DS=t.value; try{ localStorage.setItem('cafecast_dataset',DS); }catch(e){}
    db=load(); weather=null; editMenu=null; active='today';
    flash=`Switched to <strong>${DATASETS[DS]}</strong>. Each dataset is saved separately.`; runAgent(false); window.scrollTo(0,0); return; }
  if(t.id==='show-all'){ db.settings.showAll=t.checked; save(); render(); return; }
  if(t.id==='menu-filter'){ filterMenu(); return; }
  if(t.id==='sq-file'&&t.files&&t.files[0]) handleFile(t.files[0]);
});
document.addEventListener('input',e=>{ if(e.target.id==='menu-search') filterMenu(); });

/* ---------------- START ---------------- */
db=load();
$('ds-pick').value=DS;
runAgent(false);
</script>
</body>
</html>
