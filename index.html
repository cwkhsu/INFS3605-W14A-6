<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CafeCast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f1ea; --card:#fffefb; --ink:#2c211c; --muted:#756b64; --line:#e4dbd0;
  --accent:#24705a; --accent2:#24705a; --warn:#c95045; --amber:#b97818; --glass:rgba(245,241,234,.88);
  --soft:#e8f1ed; --sage:#dfece6; --cream:#fbf7f0; --espresso:#2c211c;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;min-height:100vh;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
header{position:sticky;top:0;z-index:5;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);padding:14px 16px 0;text-align:center;border-bottom:1px solid var(--line)}
h1{font-size:1.55rem;font-weight:750;letter-spacing:-.035em;margin:0}
.sub{color:var(--muted);font-size:.78rem;margin-top:2px}
.brand{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:10px}.brand-copy{text-align:left}.brand-mark{width:42px;height:42px;border-radius:14px;background:var(--accent);display:grid;place-items:center;color:#fff;box-shadow:0 7px 18px rgba(36,112,90,.2)}.brand-mark svg{width:23px;height:23px}
nav{display:flex;justify-content:center;gap:4px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;padding:7px 16px;border-radius:980px;border:none;background:transparent;color:var(--muted);font:500 .9rem var(--font);cursor:pointer}
nav button:hover{color:var(--ink)}
nav button.active{background:var(--ink);color:var(--bg)}
nav .count{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--warn);color:#fff;font-size:.72rem;line-height:18px}
main{width:100%;max-width:1480px;margin:0 auto;padding:clamp(18px,2.6vw,38px) 22px 110px}
.card{background:var(--card);border-radius:clamp(16px,2vw,22px);padding:clamp(16px,2vw,28px);margin-bottom:18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{font-size:clamp(1.15rem,1rem + .5vw,1.5rem);font-weight:600;letter-spacing:-.02em;margin:0 0 6px}
.card h3{font-size:1rem;margin:18px 0 8px}
.lead{color:var(--muted);font-size:.92rem;margin:0 0 14px;line-height:1.45}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;align-items:flex-end}
input,select,textarea{padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:400 .95rem var(--font);outline:none;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(36,112,90,.16)}
textarea{width:100%;min-height:92px;resize:vertical;line-height:1.45}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
label{font-size:.78rem;color:var(--muted);display:block;margin-bottom:5px;font-weight:500}
.field{flex:1 1 140px}
.field input,.field select{width:100%}
.help{font-size:.78rem;color:var(--muted);margin-top:4px;line-height:1.35}
.btn{display:inline-block;padding:11px 22px;border-radius:980px;border:none;background:var(--accent);color:#fff;font:500 .95rem var(--font);cursor:pointer;text-decoration:none}
.btn:hover{opacity:.88;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.secondary{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:6px 14px;font-size:.84rem}
.btn.sm{padding:7px 14px;font-size:.85rem}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn);padding:6px 14px;font-size:.84rem}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
table{width:100%;border-collapse:collapse;font-size:clamp(.82rem,.78rem + .2vw,.95rem)}
th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
th{color:var(--muted);font-weight:500;font-size:.76rem;white-space:nowrap}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pill{display:inline-block;padding:3px 10px;border-radius:980px;font-size:.74rem;font-weight:600;white-space:nowrap;margin:1px 2px 1px 0}
.pill.low{background:rgba(215,0,21,.12);color:var(--warn)}
.pill.ok{background:rgba(29,138,74,.14);color:var(--accent2)}
.pill.mid{background:rgba(255,159,10,.16);color:var(--amber)}
.pill.info{background:rgba(0,113,227,.12);color:var(--accent)}
.badge{display:inline-block;padding:1px 8px;border-radius:6px;font-size:.7rem;font-weight:600;background:var(--soft);color:var(--accent);vertical-align:middle;white-space:nowrap}
.big{font-size:clamp(2rem,1.4rem + 2vw,3.2rem);font-weight:700;letter-spacing:-.04em;line-height:1.1}
.big.sm{font-size:clamp(1.5rem,1.2rem + .9vw,2.2rem)}
.muted{color:var(--muted);font-size:.85rem}
.empty{color:var(--muted);font-size:.95rem;padding:18px 0;text-align:center}
.del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:2px 6px}
.del:hover{color:var(--warn)}
.label{font-size:.85rem;color:var(--muted);font-weight:500;margin-bottom:2px}
.src{font-size:.78rem;color:var(--muted);margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.dash-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(12px,1.6vw,22px)}
.dash-grid .card{margin-bottom:0}
.c5{grid-column:span 5}.c7{grid-column:span 7}
.fhead{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px 28px;margin-top:10px}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:8px}
.rec{padding:12px 0;border-bottom:1px solid var(--line);font-size:.95rem;line-height:1.45}
.rec:last-child{border-bottom:none}
.rec .btn{margin-top:10px}
.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 18px}
.status-box{background:var(--bg);border-radius:14px;padding:12px 14px}
.status-box strong{display:block;font-size:1.35rem;line-height:1.15;margin-top:3px}
.action-list{margin:12px 0;border-top:1px solid var(--line)}
.action-row{display:grid;grid-template-columns:minmax(120px,1fr) auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.action-row .why{color:var(--muted);font-size:.82rem;line-height:1.35;margin-top:3px}
.action-row .qty{text-align:right;font-weight:600;white-space:nowrap}
.section-label{font-size:.76rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:14px}
.reason-short{color:var(--ink);font-size:.84rem;line-height:1.35;max-width:420px}
.reason-detail{color:var(--muted);font-size:.8rem;line-height:1.4;max-width:520px}
.calc-grid{display:grid;grid-template-columns:repeat(3,minmax(90px,1fr));gap:7px;margin:9px 0}.calc-step{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:8px}.calc-step span{display:block;color:var(--muted);font-size:.68rem;line-height:1.25}.calc-step strong{display:block;font-size:.86rem;margin-top:3px}.calc-note{color:var(--muted);font-size:.76rem;line-height:1.35}.attention-note{display:flex;align-items:flex-start;gap:10px;background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin:10px 0 14px}.attention-note .svg-icon{color:var(--accent);margin-top:1px}
.order-state{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.state-chip{border-radius:980px;padding:7px 11px;background:var(--bg);font-size:.82rem;color:var(--muted)}
.state-chip strong{color:var(--ink)}
.agent{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:18px;padding:14px 18px;margin-bottom:18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.agent-txt{flex:1;font-size:.92rem;line-height:1.45}
.pulse{width:12px;height:12px;border-radius:50%;background:var(--accent2);flex:0 0 auto;box-shadow:0 0 0 0 rgba(48,209,88,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(48,209,88,.5)}70%{box-shadow:0 0 0 10px rgba(48,209,88,0)}100%{box-shadow:0 0 0 0 rgba(48,209,88,0)}}
.flash{background:var(--soft);color:var(--ink);border-radius:14px;padding:12px 16px;margin-bottom:18px;font-size:.92rem;line-height:1.45}
.note{background:var(--bg);border-radius:14px;padding:12px 14px;font-size:.86rem;color:var(--muted);line-height:1.45;margin:10px 0}
.sup{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.sup-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.sup-act{display:flex;align-items:center;gap:10px}
.qin{width:84px;padding:6px 8px}
tr.skipped td{opacity:.45}
.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:6px}
.drop{display:block;border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;cursor:pointer;color:var(--muted);font-size:.95rem;margin:6px 0 12px}
.drop:hover{border-color:var(--accent);color:var(--accent)}
.drop input{display:none}
details{margin-top:12px}
summary{cursor:pointer;color:var(--accent);font-size:.9rem;font-weight:500}
details[open] summary{margin-bottom:12px}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:none}
.tick{width:24px;height:24px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;border:2px solid var(--line);color:var(--muted)}
.tick.done{background:var(--accent2);border-color:var(--accent2);color:#fff}
.edit-tbl input:not([type=checkbox]),.edit-tbl select{padding:6px 8px;font-size:.85rem;border-radius:9px}
.edit-tbl td{vertical-align:middle;padding:6px 4px}
.w-num{width:70px}.w-txt{width:130px}.w-mail{width:190px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid2 .card{margin-bottom:0}
.ds{display:flex;gap:8px;align-items:center;justify-content:center;margin:-4px 0 10px}.ds label{margin:0}.ds select{padding:7px 10px;font-size:.78rem;border-radius:12px;width:100%}
.stat-line{display:flex;justify-content:space-between;gap:8px;padding:6px 0;font-size:.92rem}
.hero-plan{background:linear-gradient(135deg,#0d2a45 0%,#123e64 55%,#0b6b59 100%);color:#fff;overflow:hidden;position:relative}
.hero-plan:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-90px;top:-120px;background:rgba(255,255,255,.08)}
.hero-plan .lead,.hero-plan .muted{color:rgba(255,255,255,.74)}
.plan-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px;position:relative;z-index:1}
.plan-kpi{padding:14px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12)}
.plan-kpi span{display:block;font-size:.75rem;color:rgba(255,255,255,.7);margin-bottom:4px}.plan-kpi strong{font-size:1.35rem}
.score{display:flex;align-items:center;gap:16px;margin:14px 0}.score-ring{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:1.25rem;font-weight:700;background:conic-gradient(var(--accent2) var(--score),var(--line) 0);position:relative}.score-ring:after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--card)}.score-ring span{position:relative;z-index:1}
.signal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.signal{border:1px solid var(--line);border-radius:14px;padding:12px}.signal b{display:block;font-size:.9rem;margin-bottom:3px}.signal small{color:var(--muted);line-height:1.35;display:block}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:center;margin:16px 0}.flow-step{background:var(--bg);border-radius:14px;padding:14px;min-height:96px}.flow-step b{display:block;margin:5px 0}.flow-icon{font-size:1.35rem}.flow-arrow{color:var(--muted);font-size:1.4rem}
.special{border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.special-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.price-cut{font-size:1.25rem;font-weight:700;white-space:nowrap}.strike{text-decoration:line-through;color:var(--muted);font-size:.82rem;margin-right:5px}.special-meta{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.active-promo{background:rgba(29,138,74,.1);border-color:rgba(29,138,74,.35)}
.brief{margin:12px 0 0;padding:0;list-style:none}.brief li{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.14);line-height:1.4}.brief li:last-child{border:0}.brief strong{color:#fff}
.limit{border-left:3px solid var(--amber);padding:10px 12px;background:rgba(255,159,10,.08);border-radius:0 12px 12px 0;color:var(--muted);font-size:.82rem;line-height:1.45}
.svg-icon{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;flex:0 0 auto}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:0 0 20px}.page-head h2{font-size:clamp(1.7rem,1.2rem + 1.2vw,2.55rem);letter-spacing:-.045em;margin:4px 0 5px}.eyebrow{text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-size:.71rem;font-weight:750}.page-head p{margin:0;color:var(--muted);font-size:.92rem}
.daily-hero{position:relative;overflow:hidden;border-radius:26px;background:linear-gradient(125deg,#2c211c 0%,#3b2d26 47%,#276f5b 135%);color:#fff;padding:28px 30px;margin-bottom:16px;box-shadow:0 14px 35px rgba(44,33,28,.13)}.daily-hero:after{content:"";position:absolute;width:290px;height:290px;border-radius:50%;right:-90px;top:-145px;background:rgba(255,255,255,.06)}.daily-hero-grid{display:grid;grid-template-columns:1.5fr repeat(3,minmax(115px,.55fr));gap:16px;align-items:end;position:relative;z-index:1}.hero-label{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.68);font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700}.hero-title{font-size:clamp(2rem,1.3rem + 2vw,3.35rem);font-weight:750;letter-spacing:-.055em;line-height:1.02;margin:10px 0 8px}.hero-copy{color:rgba(255,255,255,.72);font-size:.88rem;line-height:1.45;max-width:600px}.hero-stat{border-left:1px solid rgba(255,255,255,.17);padding-left:16px}.hero-stat span{display:block;color:rgba(255,255,255,.62);font-size:.73rem;margin-bottom:5px}.hero-stat strong{display:block;font-size:1.35rem;letter-spacing:-.03em}.hero-stat small{display:block;color:rgba(255,255,255,.65);font-size:.72rem;margin-top:4px;line-height:1.35}
.hero-ai{position:relative;z-index:2;display:grid;grid-template-columns:minmax(220px,.75fr) minmax(360px,1.25fr);gap:18px;align-items:end;border-top:1px solid rgba(255,255,255,.16);margin-top:20px;padding-top:18px}.hero-ai-copy{font-size:.82rem;line-height:1.45;color:rgba(255,255,255,.72)}.hero-ai-copy strong{display:block;color:#fff;font-size:.95rem;margin-bottom:3px}.hero-ai-copy .pill{margin-top:8px;background:rgba(255,255,255,.12);color:#fff}.hero-ai-controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:end}.hero-ai-controls label{color:rgba(255,255,255,.68)}.hero-ai-controls input{background:rgba(255,255,255,.94);border-color:transparent}.hero-ai-controls .btn{background:#fff;color:var(--espresso);white-space:nowrap}.hero-ai-controls .btn:hover{background:var(--cream)}.hero-ai-status{grid-column:1/-1;min-height:17px;color:rgba(255,255,255,.67);font-size:.75rem}.hero-ai-status.error{color:#ffd0ca}.hero-ai-result{grid-column:1/-1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:12px 14px;font-size:.82rem;line-height:1.45;color:rgba(255,255,255,.78)}.hero-ai-result strong{color:#fff}.hero-ai-result .pill{margin-left:5px;background:rgba(255,255,255,.13);color:#fff}
.metric-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.metric-tile{width:100%;font:inherit;color:inherit;text-align:left;background:var(--card);border:1px solid rgba(44,33,28,.05);border-radius:18px;padding:15px 40px 15px 17px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 18px rgba(44,33,28,.035);position:relative}.metric-tile:after{content:'→';position:absolute;right:16px;color:var(--muted);font-size:1rem;transition:transform .18s,color .18s}.metric-icon{width:38px;height:38px;border-radius:12px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:0 0 auto}.metric-icon.amber{background:#f8ead2;color:var(--amber)}.metric-icon.red{background:#f8e2df;color:var(--warn)}.metric-tile span{display:block;color:var(--muted);font-size:.72rem}.metric-tile strong{display:block;font-size:1.12rem;margin-top:2px}
.decision-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(320px,.75fr);gap:16px;margin-bottom:16px}.panel-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:4px}.panel-title h2{display:flex;align-items:center;gap:9px}.decision-stack{margin-top:10px}.decision-card{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:13px;align-items:start;padding:16px 10px;margin:0 -10px;border-bottom:1px solid var(--line);border-radius:14px}.decision-card:last-child{border-bottom:0}.decision-icon{width:42px;height:42px;border-radius:13px;background:var(--soft);color:var(--accent);display:grid;place-items:center}.decision-icon.amber{background:#f8ead2;color:var(--amber)}.decision-icon.red{background:#f8e2df;color:var(--warn)}.decision-rank{color:var(--muted);font-size:.7rem;font-weight:750;text-transform:uppercase;letter-spacing:.06em}.decision-card h3{font-size:1.03rem;margin:3px 0 4px}.decision-card p{color:var(--muted);font-size:.82rem;line-height:1.42;margin:0;max-width:680px}.decision-impact{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}.decision-action{text-align:right;min-width:130px}.decision-action strong{display:block;font-size:1rem;margin-bottom:7px}
.dashboard-link{cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background-color .18s ease}.dashboard-link:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(44,33,28,.1);border-color:rgba(36,112,90,.22)}.dashboard-link:hover:after{transform:translateX(3px);color:var(--accent)}.dashboard-link:focus-visible{outline:3px solid rgba(36,112,90,.25);outline-offset:3px}.decision-card.dashboard-link:hover{transform:none;box-shadow:none;background:var(--cream)}.daily-hero.dashboard-link:hover{box-shadow:0 18px 42px rgba(44,33,28,.19)}.daily-hero.dashboard-link:before{content:'Open sales history  →';position:absolute;right:28px;bottom:18px;z-index:2;color:rgba(255,255,255,.72);font-size:.72rem;font-weight:700;letter-spacing:.02em}
.anchor-target{scroll-margin-top:24px}.anchor-flash{animation:anchorPulse 1.15s ease}@keyframes anchorPulse{0%,100%{box-shadow:0 4px 18px rgba(44,33,28,.04)}35%{box-shadow:0 0 0 4px rgba(36,112,90,.18),0 12px 28px rgba(44,33,28,.1)}}

.acct-out{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 9px;font:600 .75rem var(--font);color:var(--ink);cursor:pointer;flex:0 0 auto}

/* Ask CafeCast: readable replies + read aloud */
.v-card{width:min(640px,100%);max-height:86vh}
.v-head-act{display:flex;align-items:center;gap:8px}
.v-auto{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--bg);border-radius:980px;padding:5px 10px;font:600 .74rem var(--font);color:var(--muted);cursor:pointer}
.v-auto.on{color:var(--accent);border-color:rgba(36,112,90,.4);background:var(--soft)}.v-auto .svg-icon{width:15px;height:15px}
.v-log{position:relative}
.v-msg.cc.rich{max-width:100%;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 10px}
.vr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:2px 4px 8px;border-radius:10px}.vr-head .v-tools{margin:0;flex:0 0 auto}
.vr-title{font-weight:700;font-size:1.02rem;letter-spacing:-.01em}
.vr-sub{color:var(--muted);font-size:.8rem;margin-top:2px}
.vr-sec{display:grid;grid-template-columns:32px 1fr;gap:11px;padding:11px 6px;border-top:1px solid var(--line);border-radius:10px;transition:background .2s}
.vr-ic{width:32px;height:32px;border-radius:10px;background:var(--soft);color:var(--accent);display:grid;place-items:center}
.vr-ic.amber{background:#f8ead2;color:var(--amber)}.vr-ic.red{background:#f8e2df;color:var(--warn)}
.vr-ic .svg-icon{width:17px;height:17px}
.vr-sec h4{margin:1px 0 3px;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.vr-sec p{margin:0;font-size:.92rem;line-height:1.5;color:var(--ink)}
.vr-sec ul{margin:5px 0 0;padding-left:18px;font-size:.88rem;line-height:1.55}
.vr-sec .vr-note{margin-top:6px;font-size:.86rem;color:var(--muted)}
.vr-sec.reading,.vr-head.reading,.v-msg [data-sec].reading{background:rgba(36,112,90,.09);box-shadow:inset 3px 0 0 var(--accent)}
.v-tools{display:flex;gap:6px;margin-top:8px}

  if(!f){ try{ f=new Intl.DateTimeFormat('en-CA',{timeZone:z,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}); }catch(e){ cafeTZ='Australia/Sydney'; return tzParts(t); } _tzf[z]=f; }
  const o={}; f.formatToParts(new Date(t)).forEach(x=>o[x.type]=x.value);
  return {y:+o.year,m:+o.month,d:+o.day,h:(+o.hour)%24,mi:+o.minute,s:+o.second};
}
const pad2=n=>String(n).padStart(2,'0');
const isoOf=t=>{ const k=TZ()+'|'+Math.floor(t/9e5); let v=_isoC.get(k); if(!v){ const x=tzParts(t); v=x.y+'-'+pad2(x.m)+'-'+pad2(x.d); if(_isoC.size>5000) _isoC.clear(); _isoC.set(k,v); } return v; };
const isoUTC=iso=>{ const [y,m,d]=iso.split('-').map(Number); return Date.UTC(y,m-1,d); };
const isoAdd=(iso,n)=>new Date(isoUTC(iso)+n*DAY).toISOString().slice(0,10);
const isoDiff=(a,b)=>Math.round((isoUTC(a)-isoUTC(b))/DAY);

const tzOffset=t=>{ const x=tzParts(t); return Date.UTC(x.y,x.m-1,x.d,x.h,x.mi,x.s)-Math.floor(t/1000)*1000; };
const midnightOf=iso=>{ const g=isoUTC(iso); let t=g-tzOffset(g); t=g-tzOffset(t); return t; };

  /* The workbook's "today" is a Wednesday. Rotate its 6-week history so each weekday's trading pattern lands on the
     same real weekday (Saturdays stay busy on Saturdays), and move sample bookings to the same weekday they were planned for. */
  const sh=(dowISO(todayISO())-3+7)%7, past=(k,n)=>-1-((-1-k+sh)%n), fut=k=>{ let x=k-sh; while(x<0) x+=7; return x; };
  const ids={}, mids={};
  const ingredients=D.ing.map(([id,name,unit,shelf,cost,sid,pack,par,min,per])=>{ const s=D.sup[sid]||{};
    const o={id:cid(),name,unit,cost,supplier:s.name||'',email:s.email||'',reorder:min,par,lead:s.lead||1,days:s.days||null,cutoff:s.cutoff||'',minOrder:s.min||0,shelf,pack,perishable:!!per,batches:[]};
    ids[id]=o.id; return o; });
  const byId=id=>ingredients.find(x=>x.id===ids[id]);
  D.bat.forEach(([iid,q,k])=>{ const i=byId(iid); if(i) addBatch(i,q,iso(k)); });
  const menu=D.menu.map(([id,name,price])=>{ const m={id:cid(),name,price,recipe:[],src:'setup',noPerishables:false}; mids[id]=m.id; return m; });
  D.rec.forEach(([mid,iid,q])=>{ const m=menu.find(x=>x.id===mids[mid]); if(m&&ids[iid]) m.recipe.push({ing:ids[iid],qty:q}); });

  const notes=D.notes.map(([k,type,text,by])=>({id:cid(),date:iso(k),type,text,by}));
  db={v:3,seededISO:todayISO(),dataset:'littlefern',ingredients,menu,sales,waste,orders:[],events,extras,notes,promos:[],drafts:{},skip:{},wasteChecks:{},importKeys:{},dismissed:{},
    settings:{buffer:D.cafe.buffer,cover:2,mode:'email',modeSet:true,webhook:'',lat:D.cafe.lat,lon:D.cafe.lon,place:D.cafe.place,state:'AU-NSW',holidayUplift:10,tmKey:'',geminiKey:'',geminiModel:'gemini-3.8-flash',showAll:false,
      stockCountTs:t0,lastImport:{ts:Date.now(),label:'Square sales history (6 weeks)',rows:sales.length},lastScan:null,lastScanTs:null,scanNote:'',cafeName:D.cafe.name},aiBrief:null};
  return db;

const ingById=id=>db.ingredients.find(i=>i.id===id);
const menuById=id=>db.menu.find(m=>m.id===id);
const stockOf=i=>r2(sum(i.batches,b=>b.qty));
const byExp=(a,b)=>{const x=a.expiry||'9999',y=b.expiry||'9999';return x<y?-1:x>y?1:0;};
function consume(i,q){ i.batches.sort(byExp); for(const b of i.batches){ if(q<=0) break; const t=Math.min(b.qty,q); b.qty=r2(b.qty-t); q-=t; } i.batches=i.batches.filter(b=>b.qty>0.0001); }
function addBatch(i,q,exp){ if(q<=0) return; const ex=i.batches.find(b=>b.expiry===exp); if(ex) ex.qty=r2(ex.qty+q); else i.batches.push({qty:r2(q),expiry:exp}); }
const newExpiry=i=>i.shelf?addDaysISO(+i.shelf):null;
function setStock(i,n){ const cur=stockOf(i); if(n<cur) consume(i,cur-n); else addBatch(i,n-cur,newExpiry(i)); }
const costOfItem=m=>sum(m.recipe,r=>{const i=ingById(r.ing);return i?i.cost*r.qty:0;});
const needsRecipe=m=>!m.recipe.length&&!m.noPerishables;
function deductForSale(m,q){ m.recipe.forEach(r=>{const i=ingById(r.ing); if(i) consume(i,r.qty*q);}); }
function logWaste(i,q,reason,auto){ consume(i,q); db.waste.push({id:cid(),ingId:i.id,name:i.name,unit:i.unit,qty:r2(q),reason,cost:r2(i.cost*q),ts:Date.now(),auto:!!auto}); }

/* Expired batches are removed from stock and logged as waste automatically */
function autoExpire(){
  let n=0;
  db.ingredients.forEach(i=>{
    i.batches.filter(b=>b.expiry&&daysUntil(b.expiry)<0).forEach(b=>{
      db.waste.push({id:cid(),ingId:i.id,name:i.name,unit:i.unit,qty:r2(b.qty),reason:'Expired (auto-logged)',cost:r2(i.cost*b.qty),ts:Date.now(),auto:true}); n++;
    });
    i.batches=i.batches.filter(b=>!(b.expiry&&daysUntil(b.expiry)<0));
  });
  if(n) save(); return n;
}

/* ---------------- SQUARE IMPORT ---------------- */
function parseCSV(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f);f=''; if(row.some(x=>x.trim()!=='')) rows.push(row); row=[]; }
    else f+=c;
  }
  row.push(f); if(row.some(x=>x.trim()!=='')) rows.push(row);
  return rows;
}
function parseDate(s){ s=String(s||'').trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return [+m[1],+m[2],+m[3]];
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))){ const a=+m[1],b=+m[2]; let y=+m[3]; if(y<100) y+=2000; return b>12?[y,a,b]:[y,b,a]; }
  return null; }
function parseTime(s){ const m=String(s||'').trim().match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*(am|pm)?/i); if(!m) return [12,0];
  let h=+m[1]; const ap=(m[3]||'').toLowerCase(); if(ap==='pm'&&h<12) h+=12; if(ap==='am'&&h===12) h=0; return [h,+m[2]]; }
const num=s=>parseFloat(String(s??'').replace(/[^0-9.\-]/g,''));

function importSquare(text,label){
  const rows=parseCSV(text);
  const hi=rows.findIndex(r=>{const h=r.map(x=>x.trim().toLowerCase());return h.includes('item')&&(h.includes('qty')||h.includes('quantity'));});
  if(hi<0) return {err:'Couldn\u2019t find the "Item" and "Qty" columns. In Square, export the Item Sales detail report (CSV or Excel).'};
  const h=rows[hi].map(x=>x.trim().toLowerCase());
  const col=(...n)=>{for(const x of n){const i=h.indexOf(x); if(i>=0) return i;} return -1;};
  const iD=col('date'),iT=col('time'),iI=col('item'),iQ=col('qty','quantity'),iG=col('gross sales','net sales','sales'),iX=col('transaction id','payment id');
  let added=0,dup=0,newItems=0,today=0;
  rows.slice(hi+1).forEach(r=>{
    const name=(r[iI]||'').trim(), qty=num(r[iQ]); if(!name||!qty) return;
    const dp=iD>=0?parseDate(r[iD]):null, tp=iT>=0?parseTime(r[iT]):[12,0];
    const ts=dp?midnightOf(dp[0]+'-'+pad2(dp[1])+'-'+pad2(dp[2]))+(tp[0]*60+tp[1])*60e3:Date.now();
    const key=(iX>=0&&r[iX])?r[iX]+'|'+name:[r[iD],r[iT],name,r[iQ],r[iG]].join('|');
    if(db.importKeys[key]){dup++;return;} db.importKeys[key]=1;
    const gross=iG>=0?num(r[iG]):NaN;
    let m=db.menu.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!m){ m={id:cid(),name,price:gross>0?r2(gross/qty):0,recipe:[],src:'square',noPerishables:false}; db.menu.push(m); newItems++; }
    db.sales.push({id:cid(),menuId:m.id,qty,ts,rev:gross>0?gross:m.price*qty,src:'square'});
    if(ts>=db.settings.stockCountTs){ deductForSale(m,qty); today++; }
    added++;
  });
  if(added) db.settings.lastImport={ts:Date.now(),label,rows:added};
  return {added,dup,newItems,today};
}

function sampleCSV(){
  const base={'Flat White':[45,'Coffee',5],'Latte':[35,'Coffee',5],'Cappuccino':[20,'Coffee',5],'Oat Latte':[18,'Coffee',5.8],
    'Avo Toast':[14,'Food',16],'Eggs on Toast':[10,'Food',14],'Smashed Avo & Poached Eggs':[9,'Food',19.5],'Banana Bread':[12,'Food',6]};
  const rows=[['Date','Time','Category','Item','Qty','Price Point Name','Gross Sales','Transaction ID']];
  const frac=Math.min(1,Math.max(0,(nowMins()/60-7)/8));
  for(let d=14;d>=0;d--){
    const date=addDaysISO(-d), dow=dowISO(date);
    const f=(dow===0||dow===6)?1.25:dow===1?0.9:1, part=d===0?frac:1; if(part<=0) continue;
    for(const [item,[q,cat,price]] of Object.entries(base)){
      const qty=Math.round(q*f*part*(0.85+Math.random()*0.3)); if(qty<=0) continue;

    }

}

/* ---------------- FORECASTING ---------------- */
function completeDays(){ const t0=startOfDay(Date.now()), s=new Set(); db.sales.forEach(x=>{ if(x.ts<t0&&x.ts>=t0-14*DAY) s.add(isoOf(x.ts)); }); return s.size; }
function availableHistoryDays(){ const t0=startOfDay(Date.now()), s=new Set(); db.sales.forEach(x=>{ if(x.ts<t0) s.add(isoOf(x.ts)); }); return s.size; }
function usageNormal(){
  const t0=startOfDay(Date.now()), n=completeDays(), u={}; usageSrc={};
  if(n){ db.sales.forEach(s=>{ if(s.ts>=t0||s.ts<t0-14*DAY) return; const m=menuById(s.menuId); if(!m) return; m.recipe.forEach(r=>u[r.ing]=(u[r.ing]||0)+r.qty*s.qty); });
    for(const k in u){ u[k]/=n; usageSrc[k]='sales'; } }
  /* Owner's "usual use per day" stands in until there are ~3 weeks of sales, then fades out */
  const w=Math.min(1,(n||0)/21);
  db.ingredients.forEach(i=>{ const e=+i.est||0; if(!(e>0)) return; const sv=u[i.id]||0;
    if(sv>0&&w>0){ u[i.id]=w*sv+(1-w)*e; usageSrc[i.id]=w>=1?'sales':'blend'; } else { u[i.id]=e; usageSrc[i.id]='est'; } });
  return u;
}
function salesHistory(){
  const t0=startOfDay(Date.now()), m={};
  db.sales.forEach(s=>{ if(s.ts>=t0||s.ts<t0-28*DAY) return; const k=isoOf(s.ts); m[k]=m[k]||{rev:0,qty:0,dow:dowISO(k)}; m[k].rev+=s.rev; m[k].qty+=s.qty; });
  return Object.values(m);
}
function baseForecast(){
  const past=salesHistory(); if(!past.length) return null;
  return {avgRev:sum(past,v=>v.rev)/past.length, avgQty:sum(past,v=>v.qty)/past.length, days:past.length};
}
/* Weekday pattern: average revenue on each weekday vs the overall daily average (last 4 weeks) */
function dowTable(){
  const past=salesHistory(), t={}; if(!past.length) return t;
  const avg=sum(past,v=>v.rev)/past.length; if(avg<=0) return t;
  for(let w=0;w<7;w++){ const x=past.filter(v=>v.dow===w); if(x.length) t[w]=Math.min(1.6,Math.max(0.5,(sum(x,v=>v.rev)/x.length)/avg)); }
  return t;
}
const eventsOn=d=>db.events.filter(e=>e.date===d&&!(e.sample&&db.settings.liveOnly!==false));
const wdOf=k=>dowISO(addDaysISO(k));
const dayName=iso=>fmtISO(iso,{weekday:'short'});
const dayLabel=iso=>{ const d=daysUntil(iso); return d===0?'today':d===1?'tomorrow':fmtISO(iso,{weekday:'short',day:'numeric',month:'short'}); };
/* Demand multiplier for day k from today: weekday pattern x weather (today) x events */
function dayFactor(k,tbl){
  let f=tbl[wdOf(k)]??1;
  if(wetDay(wxOn(addDaysISO(k)))) f*=0.9;
  return f*Math.max(0.3,1+sum(eventsOn(addDaysISO(k)),e=>+e.uplift||0)/100);
}
/* Extra demand from owner inputs such as catering orders */
function extraUse(ingId,k){
  const d=addDaysISO(k);
  return sum((db.extras||[]).filter(x=>x.date===d),x=>sum(x.menuIds,mid=>{ const m=menuById(mid); return m?sum(m.recipe.filter(r=>r.ing===ingId),r=>r.qty*x.qty):0; }));
}
/* When would an order placed now arrive, and how long until the delivery after that? */
function deliveryPlan(i,cover){
  let lead=Math.max(0,+i.lead||1);
  if(i.cutoff){ const [h,m]=String(i.cutoff).split(':').map(Number); if(nowMins()>h*60+(m||0)) lead+=1; }
  if(!i.days||!i.days.length) return {lead,cycle:cover,date:addDaysISO(lead)};
  let k=lead; while(!i.days.includes(wdOf(k))&&k<lead+14) k++;
  let k2=k+1; while(!i.days.includes(wdOf(k2))&&k2<k+14) k2++;
  return {lead:k,cycle:k2-k,date:addDaysISO(k)};
}
function factors(tbl){
  tbl=tbl||dowTable();
  const dowF=tbl[wdOf(0)]??1, wxF=isWet()?0.9:1;
  const evF=Math.max(0.3,1+sum(eventsOn(todayISO()),e=>+e.uplift||0)/100);
  return {dowF,wxF,evF,total:dowF*wxF*evF};
}
const openIngIds=()=>new Set(db.orders.filter(o=>o.status!=='received').flatMap(o=>o.lines.map(l=>l.ingId)));
const recentlyReceivedIngIds=()=>new Set(db.orders.filter(o=>o.status==='received'&&o.recvTs&&Date.now()-o.recvTs<12*3600e3).flatMap(o=>o.lines.map(l=>l.ingId)));

/* The agent: forecast each day until the next-but-one delivery, check stock + expiry batches, draft orders per supplier */
function analyse(){
  const u=usageNormal(), tbl=dowTable(), F=factors(tbl), busy=openIngIds(), receivedRecently=recentlyReceivedIngIds();
  const buf=1+(+db.settings.buffer||0)/100, cover=+db.settings.cover||1, H=45;
  const dfs=[...Array(H)].map((_,k)=>dayFactor(k,tbl));
  const plans=db.ingredients.map(i=>{
    const stock=stockOf(i), norm=u[i.id]||0;
    const dem=dfs.map((f,k)=>norm*f+extraUse(i.id,k)), fc=dem[0], has=dem.some(x=>x>0);
    const sumD=(a,b)=>sum(dem.slice(Math.max(0,a),Math.min(H,b)),x=>x);
    const dp=deliveryPlan(i,cover), lead=dp.lead, cyc=dp.cycle;
    let rem=stock, daysLeft=Infinity;
    if(has) for(let k=0;k<H;k++){ if(dem[k]>=rem){ daysLeft=k+(dem[k]>0?rem/dem[k]:0); break; } rem-=dem[k]; }
    let used=0,risk=0;
    if(has) [...i.batches].sort(byExp).forEach(b=>{ if(!b.expiry) return; const d=daysUntil(b.expiry);
      const cum=d<0?0:sumD(0,d)+(d<H?0.5*dem[d]:0), take=Math.min(b.qty,Math.max(0,cum-used)); used+=take; risk+=b.qty-take; });
    risk=r2(risk);
    const eb=[...i.batches].filter(b=>b.expiry).sort(byExp)[0];
    const next=eb?{d:daysUntil(eb.expiry),qty:eb.qty}:null;
    const untilDel=sumD(0,lead), nextCyc=sumD(lead,lead+cyc);
    const low=stock<=(+i.reorder||0), out=has&&daysLeft<lead+1, short=has&&(stock-risk)<untilDel+nextCyc;
    const onOrder=busy.has(i.id), justReceived=receivedRecently.has(i.id);
    const need=!onOrder&&(low||short)&&!(justReceived&&!out);
    let autoQty=0,why='',target=0;
    if(need){
      target=has?untilDel+nextCyc*buf:(+i.par||(+i.reorder||0)*2); let capped=false;
      if(i.perishable&&i.shelf&&has){ const cap=untilDel+sumD(lead,lead+(+i.shelf)); if(cap<target){target=cap;capped=true;} }
      autoQty=roundQty(i,target-(stock-risk));
      const p=[];
      if(out) p.push(`runs out in ~${fmt(daysLeft)} days, before the ${dayName(dp.date)} delivery`);
      else if(short) p.push(`won’t last until the following delivery: needs ~${fmt(untilDel+nextCyc)} ${i.unit}, has ${fmt(stock-risk)} usable`);
      else p.push('below reorder point');
      const drv=[];
      for(let k=0;k<lead+cyc;k++){ const d=addDaysISO(k);
        eventsOn(d).filter(e=>Math.abs(+e.uplift)>=5).forEach(e=>drv.push(`${e.name} ${dayName(d)} (${+e.uplift>=0?'+':''}${e.uplift}%)`));
        if(extraUse(i.id,k)>0) (db.extras||[]).filter(x=>x.date===d).forEach(x=>drv.push(`catering ${dayName(d)}`)); }
      if(drv.length) p.push('drivers: '+[...new Set(drv)].slice(0,3).join(', '));
      if(risk>0.05) p.push(`${fmt(risk)} ${i.unit} on hand will expire before it’s used`);
      if(capped) p.push(`capped to ${i.shelf}-day shelf life`);
      if(+i.pack>1||(+i.pack>0&&+i.pack<1)) p.push(`packs of ${i.pack}`);
      if(usageSrc[i.id]==='est') p.push('based on your usual-use estimate (learning)'); else if(usageSrc[i.id]==='blend') p.push('blending your estimate with sales so far');
      why=p.join(' · ');
    }
    const status=next&&next.d<0?'expired':out?'out':need?'order':risk>0.05?'risk':(next&&next.d<=2)?'exp':'ok';
    return {i,stock,norm,fc,daysLeft,risk,next,low,out,need,onOrder,justReceived,autoQty,why,status,dp,target,untilDel,nextCyc};
  });
  const g={};
  plans.forEach(p=>{
    if(!p.need||p.autoQty<=0) return;
    const s=p.i.supplier||'Unassigned supplier';
    g[s]=g[s]||{supplier:s,email:p.i.email||'',lines:[],total:0,delivery:p.dp.date,cutoff:p.i.cutoff||'',min:+p.i.minOrder||0};
    const ov=db.drafts[p.i.id], qty=ov!=null?ov:p.autoQty, skip=!!db.skip[p.i.id];
    g[s].lines.push({ingId:p.i.id,name:p.i.name,unit:p.i.unit,qty,auto:p.autoQty,edited:ov!=null&&ov!==p.autoQty,cost:p.i.cost,why:p.why,skip});
  });
  const groups=Object.values(g); groups.forEach(x=>x.total=sum(x.lines.filter(l=>!l.skip),l=>l.qty*l.cost));
  return {F,plans,groups};
}

/* ---------------- DECISION INTELLIGENCE ---------------- */
function dataReadiness(){
  const days=availableHistoryDays(), t0=startOfDay(Date.now()), recent=db.sales.filter(s=>s.ts<t0&&s.ts>=t0-28*DAY);
  const sold=sum(recent,s=>s.qty), mapped=sum(recent.filter(s=>{const m=menuById(s.menuId);return m&&m.recipe.length;}),s=>s.qty);
  const coverage=sold?Math.round(mapped/sold*100):0;
  const stock=Math.round(100*db.ingredients.filter(i=>i.batches&&i.batches.length&&(!i.perishable||i.shelf)).length/Math.max(1,db.ingredients.length));
  const external=(weather?10:0)+(eventsOn(todayISO()).length+eventsOn(addDaysISO(1)).length?10:4);
  const live=db.sales.some(s=>s.ts>=t0&&s.src!=='manual');
  let score=Math.max(15,Math.min(98,Math.round(Math.min(35,days/28*35)+coverage*.35+stock*.2+external)));
  if(!live) score=Math.min(79,score);
  const L=learningState(); if(L.on) score=Math.min(score,40);
  const label=score>=80?'High':score>=60?'Medium':'Low';
  return {days,coverage,stock,score,label,sold,live,learning:L.on};
}
function menuSpecials(A){
  const activePromos=new Map((db.promos||[]).filter(p=>p.active).map(p=>[p.menuId,p]));
  const ideas=[];
  A.plans.filter(p=>p.risk>0.05).forEach(p=>{
    db.menu.filter(m=>m.recipe.some(r=>r.ing===p.i.id)).forEach(m=>{
      const use=m.recipe.find(r=>r.ing===p.i.id).qty; if(!(use>0)) return;
      const units=Math.max(1,Math.ceil(p.risk/use)), d=p.next?p.next.d:4;
      const discount=d<=1?20:d<=2?15:10, cost=costOfItem(m), floor=Math.max(cost*1.5,cost/.7);
      const proposed=Math.min(m.price,Math.max(floor,Math.round(m.price*(1-discount/100)*2)/2));
      const actual=m.price>0?Math.max(0,Math.round((1-proposed/m.price)*100)):0;
      const saving=p.risk*p.i.cost, margin=proposed>0?Math.round((proposed-cost)/proposed*100):0;
      ideas.push({id:m.id,m,p,units,proposed,actual,cost,margin,saving,active:activePromos.get(m.id),score:saving+(d<=1?20:d<=2?10:0)+Math.max(0,margin)/10});
    });
  });
  const seen=new Set(); return ideas.sort((a,b)=>b.score-a.score).filter(x=>!seen.has(x.id)&&seen.add(x.id)).slice(0,3);
}
function ownerBriefing(A){
  const bf=baseForecast(), exp=bf?bf.avgRev*A.F.total:null, lines=A.groups.flatMap(g=>g.lines.filter(l=>!l.skip&&l.qty>0));
  const risky=A.plans.filter(p=>p.risk>0.05), activePromos=(db.promos||[]).filter(p=>p.active);
  const factor=Math.round((A.F.total-1)*100), out=[];
  out.push(`<strong>Plan for ${factor===0?'normal':Math.abs(factor)+'% '+(factor>0?'higher':'lower')} demand today</strong>${exp?` (${money(exp)} expected revenue)`:''}.`);
  out.push(lines.length?`Review <strong>${lines.length} draft item${lines.length===1?'':'s'}</strong> across ${A.groups.length} supplier${A.groups.length===1?'':'s'} before ordering.`:'No new supplier order needs approval.');
  out.push(risky.length?`Use <strong>${risky[0].i.name}</strong> first; ${fmt(risky[0].risk)} ${risky[0].i.unit} may expire unused.`:'No material expiry risk is forecast.');
  if(activePromos.length) out.push(`<strong>${activePromos.length} menu special${activePromos.length===1?' is':'s are'} active</strong> to move at-risk stock.`);
  return out;
}

function cleanJsonText(s){ return String(s||'').replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim(); }

function noteUplift(text){
  const t=String(text).toLowerCase(), m=/([+-]?\d+)\s*(%|percent)/.exec(t);
  let u=m?parseInt(m[1]):(/clos|roadwork|construction|parking|rain|storm|quiet|slow|fewer|less|short.?staff|outage|power|strike/.test(t)?-15:/busy|busier|event|festival|market|game|concert|holiday|tour|group|crowd|launch|promo|more/.test(t)?15:0);
  if(/quiet|slow|fewer|less|down|clos|roadwork/.test(t)&&u>0) u=-u;

}

    nextStep:'Every order quantity has been recalculated.'};

/* ---------------- WEATHER + LOCAL EVENTS (fetched online) ---------------- */
/* Weather comes from Open-Meteo for the next 16 days, asked for in the cafe's time zone and stored BY DATE,
   so today's adjustment always uses today's forecast and each later day uses its own. */
let weather=null, wxDays={}, wxStatus='loading';
const wetDay=w=>!!w&&(w.rain>=60||(w.code>=51&&w.code<=67)||(w.code>=80&&w.code<=82)||w.code>=95);
function isWet(){ return wetDay(weather); }
const wxOn=iso=>wxDays[iso]||null;
function syncWeather(){ weather=wxDays[todayISO()]||null; }
function useWxCache(){ const c=db.wx, s=db.settings; wxDays=(c&&c.days&&c.lat===s.lat&&c.lon===s.lon)?c.days:{}; syncWeather(); wxStatus=weather?'cached':'loading'; }
function wxText(c){ return c===0?'Clear':c<=3?'Partly cloudy':c<=48?'Fog':c<=67?'Rain':c<=77?'Snow':c<=82?'Showers':'Thunderstorms'; }
function loadWeather(){
  const s=db.settings; useWxCache();
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lon}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=${encodeURIComponent(TZ())}&forecast_days=16`;

/* ---------------- SUBURB SEARCH ----------------

  WA:['Western Australia','Australia/Perth'],TAS:['Tasmania','Australia/Hobart'],ACT:['Australian Capital Territory','Australia/Sydney'],NT:['Northern Territory','Australia/Darwin']};
const stateShort=n=>{ n=String(n||'').trim(); if(AU_STATES[n.toUpperCase()]) return n.toUpperCase(); const k=Object.keys(AU_STATES).find(k=>AU_STATES[k][0].toLowerCase()===n.toLowerCase()); return k||''; };
const stateOfPostcode=pc=>{ const n=+pc; if(!(n>0)) return ''; if((n>=2600&&n<=2618)||(n>=2900&&n<=2920)) return 'ACT'; return n<800?'':n<1000?'NT':n<3000?'NSW':n<4000?'VIC':n<5000?'QLD':n<6000?'SA':n<7000?'WA':n<8000?'TAS':''; };

  const name=t.replace(/\s+/g,' ').trim(), alt=name.replace(/\s+(sydney|melbourne|brisbane|perth|adelaide|hobart|darwin|australia)$/i,'').trim();
  return {name,alt:alt!==name?alt:'',state:st,postcode:pc,hint:/sydney/i.test(q)?'NSW':/melbourne/i.test(q)?'VIC':/brisbane/i.test(q)?'QLD':/perth/i.test(q)?'WA':/adelaide/i.test(q)?'SA':/hobart/i.test(q)?'TAS':''};

/* Backtest: how close would this forecast method have been on each of the last 14 days, vs assuming every day is average (ordering by habit)? */
function backtest(){
  const t0=startOfDay(Date.now()), byDay={};
  db.sales.forEach(s=>{ if(s.ts>=t0) return; const k=Math.round((startOfDay(s.ts)-t0)/DAY); byDay[k]=(byDay[k]||0)+s.rev; });
  const res=[];
  for(let k=-14;k<=-1;k++){ if(!(byDay[k]>0)) continue;
    const prior=[]; for(let j=k-28;j<k;j++) if(byDay[j]>0) prior.push({k:j,rev:byDay[j]});
    if(prior.length<14) continue;
    const avg=sum(prior,x=>x.rev)/prior.length, same=prior.filter(x=>wdOf(x.k)===wdOf(k));
    const f=same.length?Math.min(1.6,Math.max(.5,(sum(same,x=>x.rev)/same.length)/avg)):1;
    res.push({k,actual:byDay[k],cc:avg*f,flat:avg});
  }
  if(!res.length) return null;
  const err=key=>sum(res,x=>Math.abs(x[key]-x.actual)/x.actual)/res.length*100;
  return {n:res.length,cc:err('cc'),flat:err('flat')};
}

const ASSUME_DEFAULT={maxOut:1,hourly:35,manualOrderMin:35,manualWasteMin:15,ccOrderMin:5,secPerCheck:30,walkaway:60,wasteCut:30,price:49,days:7};

  ccOrderMin:['Reviewing CafeCast drafts','min/day'],secPerCheck:['Confirming one flagged item','seconds'],walkaway:['Customers who leave if an item is sold out','%'],

function menuRevPerDay(){ const t0=startOfDay(Date.now()), n=Math.max(1,completeDays()), r={};
  db.sales.forEach(s=>{ if(s.ts>=t0||s.ts<t0-14*DAY) return; r[s.menuId]=(r[s.menuId]||0)+s.rev; }); for(const k in r) r[k]/=n; return r; }

/* If a stock recommendation is ignored, the item runs out and the dishes that need it can't be sold until the delivery after next */
function stockoutCost(p,mr,a){
  const none={days:0,rev:0,gp:0,dishes:[]};
  if(!p||!p.need||!(p.daysLeft<Infinity)) return none;
  const gap=Math.min(a.maxOut,Math.max(0,p.dp.lead+p.dp.cycle-p.daysLeft)); if(gap<=0.05) return none;
  const dishes=db.menu.filter(m=>m.recipe.some(r=>r.ing===p.i.id)), share=a.walkaway/100;
  return {days:r2(gap),rev:sum(dishes,m=>mr[m.id]||0)*gap*share,gp:sum(dishes,m=>(mr[m.id]||0)*marginOf(m))*gap*share,dishes:dishes.map(m=>m.name)};
}
/* "Habit" ordering = topping stock back up to the usual par level, regardless of forecast demand */
const habitQty=p=>roundQty(p.i,Math.max(0,(+p.i.par||(+p.i.reorder||0)*2)-p.stock));
function computeImpact(A){
  const a=assume(), mr=menuRevPerDay(), t0=startOfDay(Date.now()), pl=new Map(A.plans.map(p=>[p.i.id,p]));
  const w14=db.waste.filter(w=>w.ts>=t0-14*DAY&&w.ts<t0), prevW=w14.filter(w=>PREVENTABLE.test(w.reason));
  const first=w14.length?Math.min(...w14.map(w=>w.ts)):t0-DAY, span=Math.max(1,Math.min(14,Math.round((t0-startOfDay(first))/DAY)));
  const wasteWeek=sum(prevW,w=>w.cost)/span*7, wasteCutWeek=wasteWeek*a.wasteCut/100;
  const byItem={}; prevW.forEach(w=>byItem[w.name]=(byItem[w.name]||0)+w.cost/span*7);
  const topWaste=Object.entries(byItem).sort((x,y)=>y[1]-x[1]).slice(0,3);
  const atRisk=sum(A.plans.filter(p=>p.risk>0.05),p=>p.risk*p.i.cost);
  const ignore=[], lineOf={};
  A.groups.forEach(g=>g.lines.forEach(l=>{ lineOf[l.ingId]=l; if(l.skip||!(l.qty>0)) return;
    const c=stockoutCost(pl.get(l.ingId),mr,a); ignore.push({kind:'order',ing:l.ingId,title:`Order ${fmt(l.qty,2)} ${l.unit} ${l.name}`,who:g.supplier,...c}); }));

    const m=/(\d+)\s*(%|percent)/.exec(t); let u=m?parseInt(m[1]):(/quiet|slow|closed|roadworks|fewer|less/.test(t)?-15:/busy|busier|event|festival|more/.test(t)?15:0);
    if(/quiet|slow|fewer|less|down/.test(t)&&u>0) u=-u;
    const day=/tomorrow/.test(t)?addDaysISO(1):todayISO(), name=String(raw).replace(/^(note|remember|heads up|fyi)[:,]?\s*/i,'').slice(0,80);
    db.events.push({id:cid(),date:day,name:name.charAt(0).toUpperCase()+name.slice(1),uplift:u,auto:false,cal:true,src:'Owner voice note'}); save(); render();

  }
  if(/plan|brief|today|morning|what.*(do|need)|summary|update/.test(t)) return speak(briefReply(A));
  speak('Sorry, I didn’t catch that. Try: what’s my plan, approve orders, or log two litres of milk wasted.');
}

/* ---------- connection tests ---------- */
let connRes=null, connBusy=false;
async function probe(url,ms=7000){
  const c=new AbortController(), t=setTimeout(()=>c.abort(),ms), s0=performance.now();
  try{ const r=await fetch(url,{signal:c.signal}); return {ok:r.ok,status:r.status,ms:Math.round(performance.now()-s0)}; }
  catch(e){ return {ok:false,status:0,err:e&&e.name==='AbortError'?'timeout':'blocked',ms:Math.round(performance.now()-s0)}; }
  finally{ clearTimeout(t); }
}
function connWhy(r){
  if(!r) return '';
  if(r.ok) return `Connected · replied in ${r.ms} ms`;
  if(navigator.onLine===false) return 'This device is offline. Connect to Wi-Fi or a hotspot.';
  if(r.err==='timeout') return 'No reply within 7 seconds. The network is slow or filtering this service.';
  if(r.status===401||r.status===403) return 'Key rejected. Check it was copied in full, with no spaces.';
  if(r.status===400) return 'Request rejected. Usually an invalid key.';
  if(r.status===429) return 'Too many requests. Wait a minute and test again.';
  if(r.status) return `The service returned an error (${r.status}). Try again shortly.`;
  return IN_FRAME?'Blocked. Open CafeCast directly in Chrome, not inside a preview window.':'Blocked before it reached the service. Usually a file preview window or a network filter (uni or work Wi-Fi). Open CafeCast directly in Chrome, or try a phone hotspot.';
}
async function testConnections(){
  if(connBusy) return; connBusy=true; connRes={busy:true}; render();
  const s=db.settings;
  const [wx,hol,tm,gem]=await Promise.all([
    probe(`https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lon}&daily=weathercode&forecast_days=1&timezone=${encodeURIComponent(TZ())}`),
    probe(`https://date.nager.at/api/v3/PublicHolidays/${todayISO().slice(0,4)}/AU`),
    s.tmKey?probe(`https://app.ticketmaster.com/discovery/v2/events.json?apikey=${encodeURIComponent(s.tmKey)}&size=1&countryCode=AU`):Promise.resolve(null),
    s.geminiKey?probe(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(s.geminiKey)}`):Promise.resolve(null)]);
  connRes={ts:Date.now(),wx,hol,tm,gem}; connBusy=false;
  if(wx.ok) loadWeather();
  if(hol.ok||(tm&&tm.ok)){ s.lastScan=null; scanEvents(true); }
  render();
}

const ALERT_DEF={cutoff:['Supplier cut-off in 30 minutes, order not approved','clock'],expiry:['Stock expires today','alert'],autopilot:['Autopilot placed an order','bolt'],delivery:['Delivery overdue, not marked received','package']};
let toasts=[];
function alertsCfg(){ const s=db.settings; s.alerts=Object.assign({cutoff:true,expiry:true,autopilot:true,delivery:true},s.alerts||{}); return s.alerts; }
function alertLog(){ const s=db.settings, t=todayISO(); if(!s.alertLog||s.alertLog.date!==t) s.alertLog={date:t,keys:[]}; return s.alertLog; }
function pushAlert(a,force){
  const cfg=alertsCfg(), L=alertLog();
  if(!force){ if(!cfg[a.type]||L.keys.includes(a.key)||L.keys.length>=3) return; L.keys.push(a.key); logImpact('alert',`Alert: ${a.title}`,0,0); save(); }
  toasts=toasts.filter(t=>t.key!==a.key).concat(a).slice(-3); drawToasts();
}
function candidateAlerts(A,preview){
  const out=[], nm=nowMins();
  A.groups.filter(g=>g.total>0&&g.cutoff).forEach(g=>{ const [h,m]=g.cutoff.split(':').map(Number), left=h*60+(m||0)-nm;
    if(left>0&&(preview||left<=30)) out.push({key:'cut|'+g.supplier,type:'cutoff',title:`${g.supplier}: cut-off ${left<=60?`in ${left} min`:`at ${g.cutoff}`}`,
      text:`The ${money(g.total)} order isn’t approved yet. After ${g.cutoff} it moves to the next delivery day.`,actions:[['Approve','approve-sup',{sup:g.supplier}],['Review','otab',{id:'drafts'}]]}); });
  const exp=db.ingredients.filter(i=>i.perishable).map(i=>({i,q:sum(i.batches.filter(b=>b.expiry&&daysUntil(b.expiry)===0),b=>b.qty)})).filter(x=>x.q>0.01);
  if(exp.length) out.push({key:'exp',type:'expiry',title:`${exp.length} item${exp.length>1?'s':''} expire today`,text:exp.slice(0,3).map(x=>`${fmt(x.q)} ${x.i.unit} ${x.i.name}`).join(', ')+(exp.length>3?' and more':'')+'. Use them first or run a special.',actions:[['See specials','tab',{id:'waste'}]]});
  db.orders.filter(o=>o.status!=='received'&&o.delivery&&(daysUntil(o.delivery)<0||(daysUntil(o.delivery)===0&&nm>=12*60))).forEach(o=>out.push({key:'del|'+o.id,type:'delivery',title:`${o.supplier} delivery not received`,text:`It was due ${dayLabel(o.delivery)}. Mark it received so stock is right, or chase the supplier.`,actions:[['Mark received','recv',{id:o.id}],['Orders','otab',{id:'history'}]]}));
  return out;
}
function checkAlerts(){ if(!db||(DS==='mine'&&!db.settings.setupDone)) return; candidateAlerts(analyse(),false).forEach(a=>pushAlert(a)); }
function previewAlerts(){
  const c=candidateAlerts(analyse(),true);

}
function drawToasts(){
  const el=$('toasts'); if(!el) return;
  el.innerHTML=toasts.map(t=>`<div class="toast ${t.type}" role="status"><div class="t-ic">${icon((ALERT_DEF[t.type]||[])[1]||'alert')}</div><div class="t-body"><strong>${esc(t.title)}</strong><p>${esc(t.text)}</p>

function cutoffInfo(g){
  if(!g.cutoff) return {mins:9000,text:'no cut-off set'};
  const [h,m]=g.cutoff.split(':').map(Number), left=h*60+(m||0)-nowMins();
  if(left<=0) return {mins:5000-left,text:`today’s ${esc(g.cutoff)} cut-off has passed`,passed:true};
  const hh=Math.floor(left/60), mm=left%60;
  return {mins:left,soon:left<=60,text:`order by ${esc(g.cutoff)} · ${hh?`${hh} h `:''}${mm?`${mm} min`:''} left`.replace(' ·  left',' ')};
}

function shortWhy(why){

  return driver?`${first} \u00b7 ${driver}`:first;
}

function headlineWhy(why){
  return String(why||'Forecast stock is below the required level').split(' \u00b7 ')[0];
}

function orderCalculation(l,p){

  return `

function saveWasteCheck(none){
  let n=0,c=0;
  if(!none) document.querySelectorAll('[data-wq]').forEach(inp=>{ const q=parseFloat(inp.value); if(!(q>0)) return; const i=ingById(inp.dataset.wq); if(!i) return;
    const rs=document.querySelector(`[data-wr="${inp.dataset.wq}"]`); const before=db.waste.length; logWaste(i,q,rs?rs.value:'Spoiled / expired',false); n++; c+=db.waste[before].cost; });
  db.wasteChecks[todayISO()]=Date.now();
  { const a=assume(), k=document.querySelectorAll('[data-wq]').length; logImpact('check',none?'Closing waste check: nothing wasted':`Closing waste check: ${n} item${n===1?'':'s'} logged`,0,Math.max(0,a.manualWasteMin-k*a.secPerCheck/60)); }
  flash=none?'Waste check saved: nothing wasted today. Nice.':`Waste check saved: ${n} item${n===1?'':'s'}, ${money(c)}. Stock updated.`;
  save(); render();
}

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.ingf){ const [id,f]=t.dataset.ingf.split(':'), i=ingById(id); if(!i) return;
    if(f==='perishable') i.perishable=t.checked;
    else if(f==='stock') setStock(i,Math.max(0,parseFloat(t.value)||0));
    else if(['shelf','reorder','lead','cost','est','pack','par'].includes(f)) i[f]=t.value===''?null:parseFloat(t.value);
    else if(f==='supplier'){ let v=t.value; if(v==='__new'){ v=(prompt('New supplier name')||'').trim(); if(!v){ render(); return; } i.email=''; }
      const sp=supplierList().find(x=>x.name===v&&!x.items.every(y=>y.id===i.id)); i.supplier=v; if(sp) Object.assign(i,{email:sp.email,days:sp.days,cutoff:sp.cutoff,minOrder:sp.min,lead:sp.lead}); }
    else i[f]=t.value.trim();
    save(); render(); return; }
  if(t.dataset.supf){ const [en,f]=t.dataset.supf.split('|'), name=decodeURIComponent(en), v=t.value.trim();
    db.ingredients.filter(i=>i.supplier===name).forEach(i=>{ if(f==='name'){ if(v) i.supplier=v; } else if(f==='email') i.email=v; else if(f==='cutoff') i.cutoff=v; else if(f==='lead') i.lead=parseFloat(v)||0; else if(f==='min') i.minOrder=parseFloat(v)||0; });
    save(); render(); return; }
  if(t.dataset.recq!=null){ const m=menuById(editMenu), r=m&&m.recipe[+t.dataset.recq]; if(r){ r.qty=Math.max(0,parseFloat(t.value)||0); save(); render(); } return; }
  if(t.dataset.alert){ alertsCfg()[t.dataset.alert]=t.checked; save(); render(); return; }
  if(t.dataset.wizItem){ const n=t.dataset.wizItem, ex=db.ingredients.find(i=>i.name===n);
    if(t.checked&&!ex){ const T=WIZ_ITEMS.find(x=>x[1]===n); if(T) wizAdd(...T); } else if(!t.checked&&ex){ db.ingredients=db.ingredients.filter(i=>i!==ex); }
    save(); render(); return; }
  if(t.dataset.wizOwn&&!t.checked){ db.ingredients=db.ingredients.filter(i=>i.id!==t.dataset.wizOwn); save(); render(); return; }
  if(t.dataset.menuf){ const [id,f]=t.dataset.menuf.split(':'), m=menuById(id); if(m){ m[f]=parseFloat(t.value)||0; save(); render(); } return; }
  if(t.dataset.draft){ const v=parseFloat(t.value); db.drafts[t.dataset.draft]=isNaN(v)?0:Math.max(0,v); save(); render(); return; }
  if(t.dataset.skip){ if(t.checked) delete db.skip[t.dataset.skip]; else db.skip[t.dataset.skip]=true; save(); render(); return; }
  if(t.dataset.assume){ db.settings.assume=db.settings.assume||{}; db.settings.assume[t.dataset.assume]=parseFloat(t.value)||0; save(); render(); return; }
  if(t.dataset.set){ const k=t.dataset.set; db.settings[k]=['buffer','cover','holidayUplift','autoLimit'].includes(k)?(parseFloat(t.value)||0):t.value.trim();
    if(k==='liveOnly') db.settings.liveOnly=t.value==='1';
    if(k==='tz'){ try{ new Intl.DateTimeFormat('en',{timeZone:db.settings.tz}); cafeTZ=db.settings.tz; }catch(err){ db.settings.tz=cafeTZ; flash='That isn\u2019t a valid time zone. Use a name like Australia/Sydney.'; } db.wx=null; loadWeather(); db.settings.lastScan=null; scanEvents(true); }
    if(k==='mode') db.settings.modeSet=true; if(k==='tmKey'||k==='holidayUplift'){ db.settings.lastScan=null; scanEvents(true); } save(); render(); return; }
  if(t.id==='rec-item'){ editMenu=t.value; render(); return; }
  if(t.id==='rec-noper'){ const m=menuById(editMenu); if(m){ m.noPerishables=t.checked; save(); render(); } return; }
  if(t.id==='show-all'){ db.settings.showAll=t.checked; save(); render(); return; }
  if(t.id==='menu-filter'){ filterMenu(); return; }
  if(t.id==='sq-file'&&t.files&&t.files[0]) handleFile(t.files[0]);
});

/* ---------------- ACCOUNTS & SAVING ----------------
   With Supabase set in CONFIG (top of this script), sign-in uses Supabase Auth and every café's data is saved to the
   `cafes` table, so an owner can sign in from any device. A copy is also kept on the device so CafeCast opens instantly
   and keeps working through a Wi-Fi drop; changes upload a moment after they're made.
   Without Supabase set, accounts and data are kept on this device only (useful for local testing). */
const CLOUD=!!(CONFIG.supabaseUrl&&CONFIG.supabaseAnonKey);
const ACCT_KEY='cafecast_accounts', SESSION_KEY='cafecast_session';
/* Device-only accounts, used when Supabase isn't set. With Supabase, create the same user in the dashboard (see the setup guide). */
const LOCAL_SEED=[{id:'nick',email:'nick@littlefern.com.au',pw:'LittleFern#2026',dataset:'littlefern',cafe:'Little Fern Café',owner:'Nick',store:KEY_BASE+'_littlefern',builtin:true}];
let loginTab='signin', loginErr='', loginNote='', loginBusy=false, sb=null;
const cloudStore=id=>'cafecast_cloud_'+id, cloudMetaKey=id=>'cafecast_cloud_meta_'+id;

function client(){
  if(sb) return sb;
  if(!(window.supabase&&window.supabase.createClient)) throw new Error('Can’t reach CafeCast right now. Check your internet connection and try again.');
  sb=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  return sb;
}
function niceAuthError(e){
  const m=String(e&&e.message||e||'');
  if(/invalid login credentials/i.test(m)) return 'That email and password don’t match.';
  if(/email not confirmed/i.test(m)) return 'Confirm your email first: open the link we sent you, then sign in.';
  if(/already registered|already exists/i.test(m)) return 'There’s already an account with that email. Sign in instead.';
  if(/password.*(at least|short|weak)/i.test(m)) return 'Choose a stronger password (at least 8 characters).';
  if(/rate limit|too many/i.test(m)) return 'Too many attempts. Wait a minute and try again.';
  if(/fetch|network|reach/i.test(m)) return 'Can’t reach CafeCast right now. Check your internet connection and try again.';
  return m||'Something went wrong. Please try again.';
}

/* ---- device accounts (no Supabase) ---- */
function userAccounts(){ try{ return JSON.parse(localStorage.getItem(ACCT_KEY))||[]; }catch(e){ return []; } }
function saveUserAccounts(list){ try{ localStorage.setItem(ACCT_KEY,JSON.stringify(list)); }catch(e){} }
const localAccounts=()=>LOCAL_SEED.concat(userAccounts());
const findLocal=u=>{ u=String(u||'').trim().toLowerCase(); return localAccounts().find(a=>(a.email||'').toLowerCase()===u||(a.username||'').toLowerCase()===u); };
const hasSubtle=()=>{ try{ return !!(window.crypto&&crypto.subtle&&window.TextEncoder); }catch(e){ return false; } };
async function digest(str,alg){
  if(alg==='sha256'){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  let h1=0x811c9dc5,h2=0x1234567; for(let i=0;i<str.length;i++){ const c=str.charCodeAt(i); h1=Math.imul(h1^c,16777619); h2=Math.imul(h2^c,2246822519); }
  return (h1>>>0).toString(16)+(h2>>>0).toString(16);
}
async function checkLocalPw(a,pw){
  if(a.builtin) return pw===a.pw;
  if(a.alg==='sha256'&&!hasSubtle()) throw new Error('Open CafeCast from its https:// address to sign in.');
  return (await digest(a.salt+'|'+pw,a.alg))===a.hash;
}

/* ---- saving to Supabase ---- */
let sync={state:'idle',ts:0,err:''}, syncTimer=null, syncBusy=false, syncAgain=false;
function scheduleSync(){ if(!ACCT||ACCT.mode!=='cloud') return; clearTimeout(syncTimer); if(sync.state!=='saving') sync.state='pending'; syncTimer=setTimeout(pushCloud,1500); }
async function pushCloud(){
  clearTimeout(syncTimer); syncTimer=null;
  if(!ACCT||ACCT.mode!=='cloud'||!db) return;
  if(syncBusy){ syncAgain=true; return; }
  syncBusy=true; sync.state='saving'; const a=ACCT, data=db;
  try{
    const {error}=await client().from('cafes').upsert({owner_id:a.id,name:data.settings.cafeName||a.cafe||'My café',dataset:a.dataset,data,updated_at:new Date().toISOString()},{onConflict:'owner_id'});
    if(error) throw error;
    sync={state:'saved',ts:Date.now(),err:''};
  }catch(e){ sync={state:navigator.onLine===false?'offline':'error',ts:sync.ts,err:niceAuthError(e)}; console.warn('CafeCast: save to Supabase failed',e); }
  finally{ syncBusy=false; drawSyncState(); if(syncAgain){ syncAgain=false; scheduleSync(); } }
}
function syncText(){
  if(!ACCT) return '';
  if(ACCT.mode!=='cloud') return 'Saved on this device';
  return {saving:'Saving…',pending:'Saving…',saved:`Saved to your account · ${sync.ts?timeStr(sync.ts):''}`,offline:'Offline · changes will upload when you’re back online',error:`Not saved yet · ${sync.err||'will retry'}`,idle:'Saved to your account'}[sync.state]||'';
}
function drawSyncState(){ document.querySelectorAll('[data-sync]').forEach(el=>{ el.textContent=syncText(); el.classList.toggle('warn',sync.state==='error'||sync.state==='offline'); }); }
window.addEventListener('online',()=>{ if(sync.state==='offline'||sync.state==='error') pushCloud(); });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'&&syncTimer) pushCloud(); });

/* ---- sign-in screen ---- */
function renderLogin(){
  const el=$('login'); if(!el) return;
  const lPoint=(ic,t)=>`<li>${icon(ic)}<span>${t}</span></li>`;
  const hero=`<section class="login-hero"><div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h12v5a6 6 0 0 1-6 6 6 6 0 0 1-6-6Z"/><path d="M16 10h2a3 3 0 0 1 0 6h-3"/><path d="M7 3v2M11 3v2"/></svg></div>
    <h1 class="lh-title">CafeCast</h1><p class="lh-sub">Easier decisions, less waste. Order what your café will actually sell, and spend less time on stock.</p>
    <ul class="lh-points">${lPoint('trend','Forecasts today’s demand from your sales, weather, holidays and local events')}${lPoint('package','Drafts supplier orders, ready for you to approve')}${lPoint('waste','Flags stock before it expires, with specials to use it up')}</ul></section>`;
  const seg=['signin','create'].includes(loginTab)?`<div class="seg login-seg" role="tablist"><button type="button" class="${loginTab==='signin'?'on':''}" data-act="login-tab" data-v="signin">Sign in</button><button type="button" class="${loginTab==='create'?'on':''}" data-act="login-tab" data-v="create">Create account</button></div>`:'';
  const msg=`<div class="login-err" id="login-err">${esc(loginErr)}</div>${loginNote?`<div class="login-note">${esc(loginNote)}</div>`:''}`;
  const btn=t=>`<button class="btn" type="submit" ${loginBusy?'disabled':''}>${loginBusy?'Please wait…':t}</button>`;
  let body;
  if(loginTab==='loading') body=`<div class="login-loading"><span class="spin"></span>${esc(loginNote||'Opening CafeCast…')}</div>`;
  else if(loginTab==='create') body=`<div><span class="eyebrow">New café</span><h2>Create your account</h2><p class="lead" style="margin:4px 0 0">Set up takes about 25 minutes. You can stop and come back.</p></div>
    <form id="create-form" autocomplete="on" novalidate>
      <div class="login-two"><div class="field"><label for="cr-cafe">Café name</label><input id="cr-cafe" placeholder="e.g. Corner Leaf Café" required></div>
      <div class="field"><label for="cr-owner">Your first name</label><input id="cr-owner" autocomplete="given-name"></div></div>
      <div class="field"><label for="cr-email">Email</label><input id="cr-email" type="email" autocapitalize="none" autocomplete="email" required></div>
      <div class="login-two"><div class="field"><label for="cr-pw">Password</label><input id="cr-pw" type="password" autocomplete="new-password" placeholder="8+ characters" required></div>
      <div class="field"><label for="cr-pw2">Confirm password</label><input id="cr-pw2" type="password" autocomplete="new-password" required></div></div>
      ${msg}${btn('Create account')}</form>`;
  else if(loginTab==='forgot') body=`<div><span class="eyebrow">Password help</span><h2>Reset your password</h2><p class="lead" style="margin:4px 0 0">We’ll email you a link to choose a new one.</p></div>
    <form id="forgot-form" novalidate><div class="field"><label for="fp-email">Email</label><input id="fp-email" type="email" autocapitalize="none" autocomplete="email" required></div>${msg}${btn('Send reset link')}</form>
    <button type="button" class="link-btn" data-act="login-tab" data-v="signin">Back to sign in</button>`;
  else if(loginTab==='reset') body=`<div><span class="eyebrow">Password help</span><h2>Choose a new password</h2></div>
    <form id="reset-form" novalidate><div class="field"><label for="rp-pw">New password</label><input id="rp-pw" type="password" autocomplete="new-password" placeholder="8+ characters" required></div>
    <div class="field"><label for="rp-pw2">Confirm new password</label><input id="rp-pw2" type="password" autocomplete="new-password" required></div>${msg}${btn('Save and sign in')}</form>`;
  else body=`<div><span class="eyebrow">Welcome back</span><h2>Sign in to your café</h2></div>
    <form id="login-form" novalidate>
      <div class="field"><label for="li-user">Email</label><input id="li-user" type="text" inputmode="email" autocapitalize="none" autocomplete="username" required></div>
      <div class="field"><label for="li-pw">Password</label><input id="li-pw" type="password" autocomplete="current-password" required></div>
      ${msg}${btn('Sign in')}
    </form>
    ${CLOUD?'<button type="button" class="link-btn" data-act="login-tab" data-v="forgot">Forgot your password?</button>':''}`;
  el.innerHTML=`<div class="login-wrap">${hero}<section class="login-card">${seg}${body}</section></div>`;
}
function showLogin(tab,note){
  document.body.classList.add('logged-out'); loginTab=tab||'signin'; loginErr=''; loginNote=note||''; loginBusy=false; renderLogin(); window.scrollTo(0,0);
  const f=$({create:'cr-cafe',forgot:'fp-email',reset:'rp-pw',signin:'li-user'}[loginTab]); if(f&&window.innerWidth>=700) f.focus();
}
const showLoading=t=>{ document.body.classList.add('logged-out'); loginTab='loading'; loginNote=t||''; renderLogin(); };
function loginFail(m){ loginErr=m; loginBusy=false; const keep={}; document.querySelectorAll('#login input').forEach(i=>keep[i.id]=i.value); renderLogin(); Object.entries(keep).forEach(([k,v])=>{ const i=$(k); if(i&&i.type!=='password') i.value=v; }); }
function setBusy(on){ loginBusy=on; const b=document.querySelector('#login button[type=submit]'); if(b){ b.disabled=on; b.textContent=on?'Please wait…':b.dataset.t||b.textContent; } }
const val=id=>(($(id)||{}).value||'').trim();
const okEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

async function doLogin(){
  const email=val('li-user'), pw=($('li-pw')||{}).value||'';
  if(!email||!pw) return loginFail('Enter your email and password.');
  setBusy(true);
  if(CLOUD){
    try{ const {data,error}=await client().auth.signInWithPassword({email,password:pw}); if(error) throw error; await enterCloud(data.user); }
    catch(e){ loginFail(niceAuthError(e)); }
    return;
  }
  const a=findLocal(email);
  try{ if(!a||!(await checkLocalPw(a,pw))) return loginFail('That email and password don’t match.'); }catch(e){ return loginFail(e.message); }
  enterAccount({...a,mode:'local'});
}
async function doCreate(){
  const cafe=val('cr-cafe'), owner=val('cr-owner'), email=val('cr-email').toLowerCase(), pw=($('cr-pw')||{}).value||'', pw2=($('cr-pw2')||{}).value||'';
  if(!cafe) return loginFail('Enter your café’s name.');
  if(!okEmail(email)) return loginFail('Enter a valid email address.');
  if(pw.length<8) return loginFail('Use a password of at least 8 characters.');
  if(pw!==pw2) return loginFail('The two passwords don’t match.');
  setBusy(true);
  if(CLOUD){
    try{
      const {data,error}=await client().auth.signUp({email,password:pw,options:{data:{cafe_name:cafe,owner_name:owner},emailRedirectTo:location.origin+location.pathname}});
      if(error) throw error;
      if(data.user&&Array.isArray(data.user.identities)&&!data.user.identities.length) return loginFail('There’s already an account with that email. Sign in instead.');
      if(data.session) return enterCloud(data.user);
      return showLogin('signin',`Almost done. We sent a confirmation link to ${email}. Open it, then sign in.`);
    }catch(e){ return loginFail(niceAuthError(e)); }
  }
  if(findLocal(email)) return loginFail('There’s already an account with that email. Sign in instead.');
  const id='u_'+cid()+cid(), alg=hasSubtle()?'sha256':'fnv', salt=cid()+cid();
  const a={id,email,username:email,cafe,owner,dataset:'mine',store:KEY_BASE+'_u_'+id,alg,salt,hash:await digest(salt+'|'+pw,alg),created:Date.now()};
  const list=userAccounts(); list.push(a); saveUserAccounts(list);
  enterAccount({...a,mode:'local'},true);
}
async function doForgot(){
  const email=val('fp-email'); if(!okEmail(email)) return loginFail('Enter the email you signed up with.');
  setBusy(true);
  try{ const {error}=await client().auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}); if(error) throw error;
    showLogin('signin',`If ${email} has a CafeCast account, a reset link is on its way. Open it on this device.`); }
  catch(e){ loginFail(niceAuthError(e)); }
}
async function doReset(){
  const pw=($('rp-pw')||{}).value||'', pw2=($('rp-pw2')||{}).value||'';
  if(pw.length<8) return loginFail('Use a password of at least 8 characters.');
  if(pw!==pw2) return loginFail('The two passwords don’t match.');
  setBusy(true);
  try{ const {data,error}=await client().auth.updateUser({password:pw}); if(error) throw error; await enterCloud(data.user); }
  catch(e){ loginFail(niceAuthError(e)); }
}

/* Load a signed-in Supabase user's café. The first sign-in creates it. */
async function enterCloud(user){
  showLoading('Opening your café…');
  const store=cloudStore(user.id), md=user.user_metadata||{};
  let row=null, offline=false, meta=null;
  try{ meta=JSON.parse(localStorage.getItem(cloudMetaKey(user.id))||'null'); }catch(e){}
  try{
    const r=await client().from('cafes').select('name,dataset,data,updated_at').eq('owner_id',user.id).maybeSingle();
    if(r.error) throw r.error; row=r.data;
    if(!row){
      row={name:md.cafe_name||'My café',dataset:'mine',data:null};
      const ins=await client().from('cafes').insert({owner_id:user.id,name:row.name,dataset:'mine'});
      if(ins.error&&!/duplicate/i.test(ins.error.message)) throw ins.error;
    }
  }catch(e){
    let cached=null; try{ cached=localStorage.getItem(store); }catch(x){}
    if(!cached||!meta){ return showLogin('signin'), loginFail('Couldn’t open your café: '+niceAuthError(e)); }
    offline=true; row={name:meta.name,dataset:meta.dataset,data:undefined};
  }
  const fresh=!offline&&!row.data;
  try{
    localStorage.setItem(cloudMetaKey(user.id),JSON.stringify({name:row.name,dataset:row.dataset}));
    /* the phone preview frame shares this device's copy, which the main window has only just saved */
    if(!offline&&!(IN_FRAME&&localStorage.getItem(store))){ if(row.data) localStorage.setItem(store,JSON.stringify(row.data)); else localStorage.removeItem(store); }
  }catch(e){}
  sync={state:offline?'offline':'saved',ts:offline?0:Date.now(),err:''};
  enterAccount({mode:'cloud',id:user.id,email:user.email,dataset:row.dataset||'mine',cafe:row.name,owner:md.owner_name||'',store},fresh);
}
function enterAccount(a,fresh){
  ACCT=a; DS=a.dataset;
  if(a.mode==='local'){ try{ localStorage.setItem(SESSION_KEY,a.id); }catch(e){} }
  document.body.classList.remove('logged-out');
  setupPage=null; menuOpen=null; editMenu=null; ordersTab='drafts'; active='today'; weather=null; pending=null; voiceLog=[]; toasts=[]; drawToasts(); lastFlash=''; geoResults=[];
  db=load();
  if(fresh){ db.settings.cafeName=a.cafe||db.settings.cafeName; if(a.owner) db.settings.owner=a.owner;
    if(DS==='mine') flash=`Welcome to CafeCast${a.owner?', '+esc(a.owner):''}! Answer 5 quick questions to set up <strong>${esc(db.settings.cafeName||'your café')}</strong>.`; }
  save(); drawAcct(); runAgent(false); window.scrollTo(0,0);
  if(!IN_FRAME&&viewMode!=='auto'&&window.innerWidth>=960) openPhone();
  setTimeout(checkAlerts,4000);
}
async function signOut(tab){
  const a=ACCT;
  if(db) save();
  if(a&&a.mode==='cloud'&&(syncTimer||sync.state==='pending'||sync.state==='error')) await pushCloud();
  stopSpeech(); stopListen(); $('voice').classList.remove('open');
  if(phoneOpen){ phoneOpen=false; $('phone-ov').classList.remove('open'); $('phone-frame').src='about:blank'; document.body.style.overflow=''; }
  ACCT=null; db=null; toasts=[]; drawToasts(); drawAcct();
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
  if(a&&a.mode==='cloud'){
    /* clear this device's copy once it's safely in the account */
    if(sync.state==='saved'){ try{ localStorage.removeItem(a.store); }catch(e){} }
    try{ await client().auth.signOut(); }catch(e){}
  }
  sync={state:'idle',ts:0,err:''};
  showLogin(tab||'signin');
}
function drawAcct(){
  const el=$('acct-box'); if(!el) return; if(!ACCT){ el.innerHTML=''; return; }
  const cafe=(db&&db.settings.cafeName)||ACCT.cafe||DATASETS[DS];
  el.innerHTML=`<div class="acct"><span class="acct-av">${esc(String(cafe).trim().charAt(0).toUpperCase()||'C')}</span><span class="acct-t"><strong>${esc(cafe)}</strong><small>${esc(ACCT.email||ACCT.username||'')}</small></span><button class="acct-out" data-act="signout" title="Sign out">${icon('logout')}<span>Sign out</span></button></div>`;
}
async function changePassword(){
  const o=$('ap-old').value, n=$('ap-new').value;
  if(n.length<8){ flash='Use a new password of at least 8 characters.'; return render(); }
  try{
    if(ACCT.mode==='cloud'){
      const chk=await client().auth.signInWithPassword({email:ACCT.email,password:o}); if(chk.error){ flash='The current password isn’t right.'; return render(); }
      const {error}=await client().auth.updateUser({password:n}); if(error) throw error;
    }else{
      const list=userAccounts(), a=list.find(x=>x.id===ACCT.id); if(!a) return;
      if(!(await checkLocalPw(a,o))){ flash='The current password isn’t right.'; return render(); }
      a.alg=hasSubtle()?'sha256':'fnv'; a.salt=cid()+cid(); a.hash=await digest(a.salt+'|'+n,a.alg); saveUserAccounts(list);
    }
    flash='Password updated.';
  }catch(e){ flash=esc(niceAuthError(e)); }
  render();
}
document.addEventListener('submit',e=>{
  const f={'login-form':doLogin,'create-form':doCreate,'forgot-form':doForgot,'reset-form':doReset}[e.target.id];
  if(f){ e.preventDefault(); if(!loginBusy) f(); }
});
async function startApp(){
  if(CLOUD){
    const recovery=/type=recovery/.test(location.hash)||/type=recovery/.test(location.search);
    showLoading();
    try{ if(!(window.supabase&&window.supabase.createClient)) await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'); }catch(e){}
    let c; try{ c=client(); }catch(e){ showLogin(); return loginFail(e.message); }
    c.auth.onAuthStateChange(ev=>{ if(ev==='PASSWORD_RECOVERY') setTimeout(()=>showLogin('reset'),0); });
    let session=null; try{ session=(await c.auth.getSession()).data.session; }catch(e){}
    if(recovery&&session) return showLogin('reset');
    if(session) return enterCloud(session.user);
    return showLogin();
  }
  let a=null; try{ const sid=localStorage.getItem(SESSION_KEY); a=sid&&localAccounts().find(x=>x.id===sid); }catch(e){}
  if(a) enterAccount({...a,mode:'local'}); else showLogin();
}

/* ---------------- PHONE PREVIEW ----------------
   Loads this same page in a 390 px frame so the real phone layout (media queries, bottom tabs) can be checked on a laptop. */
const IN_FRAME=(()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
if(IN_FRAME) document.documentElement.classList.add('in-frame');
function fitPhone(){ const d=document.querySelector('.phone-dev'), V=VIEWS[viewMode]||VIEWS.phone; if(!d) return;
  const W=V.w+24, H=V.h+24, f=$('phone-frame'); f.style.width=V.w+'px'; f.style.height=V.h+'px'; d.style.width=W+'px'; d.style.height=H+'px';
  d.classList.toggle('tablet',viewMode==='tablet');
  const k=Math.min(1,(window.innerHeight-100)/H,(window.innerWidth-32)/W); d.style.transform=`scale(${k})`; d.parentElement.style.height=(H*k)+'px'; d.parentElement.style.width=(W*k)+'px'; }
function openPhone(){ if(IN_FRAME) return; if(!phoneOpen){ save(); phoneOpen=true; $('phone-frame').src=location.href.split('#')[0]+'#phone'; $('phone-ov').classList.add('open'); document.body.style.overflow='hidden'; } fitPhone(); drawViewCtl(); }
function closePhone(){ phoneOpen=false; $('phone-ov').classList.remove('open'); $('phone-frame').src='about:blank'; document.body.style.overflow=''; if(ACCT){ db=load(); runAgent(false); } }
window.addEventListener('resize',fitPhone);

/* Keep "today" honest: rebuild at midnight (cafe time), refresh weather every 3 hours, and re-check when the tab comes back */
function tick(){ if(!db||phoneOpen) return; checkAlerts(); if(DS!=='mine'&&db.seededISO!==todayISO()){ save(); db=load(); runAgent(true); return; } if(!db.wx||Date.now()-db.wx.ts>3*3600e3) loadWeather(); }
setInterval(tick,60e3);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') tick(); });

/* ---------------- START ---------------- */
startApp();
</script>
